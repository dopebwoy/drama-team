<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-soft: #161b22;
            --card-bg: rgba(22, 27, 34, 0.9);
            --gold: #e6c989;
            --gold-strong: #f4ddb0;
            --white: #f3efe7;
            --muted: #b9c2ca;
            --border: rgba(255, 255, 255, 0.14);
            --shadow: rgba(0, 0, 0, 0.4);
            --success: #83e3c2;
            --danger: #ff9e9e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(rgba(13, 17, 23, 0.78), rgba(13, 17, 23, 0.86)),
                url('./photos/backonlogin.jpg') center/cover no-repeat;
            color: var(--white);
        }

        .page-shell {
            width: min(92vw, 460px);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 28px 24px;
            box-shadow: 0 20px 45px var(--shadow);
            backdrop-filter: blur(8px);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .home-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: none;
        }

        .home-link:hover {
            color: var(--muted);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 2.5rem);
            text-align: center;
        }

        .subtitle {
            margin: 0 0 22px;
            text-align: center;
            color: var(--muted);
            font-size: 0.97rem;
        }

        .role-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-btn {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.08);
            color: var(--white);
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: none;
        }

        .role-btn:hover {
            background: rgba(148, 163, 184, 0.08);
            box-shadow: none;
            transform: none;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-strong));
            color: #111827;
            border-color: transparent;
            box-shadow: none;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--white);
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: none;
        }

        input:focus {
            border-color: var(--border);
            box-shadow: none;
        }

        .submit-btn {
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-strong));
            color: #17130d;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: none;
        }

        .submit-btn:hover {
            transform: none;
            box-shadow: none;
        }

        .status-text {
            margin-top: 16px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .reminder-choice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 14px 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .reminder-choice input {
            width: auto;
            min-width: 0;
            margin: 3px 0 0;
            accent-color: var(--gold);
        }

        .status-text[data-kind="error"] { color: var(--danger); }
        .status-text[data-kind="success"] { color: var(--success); }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <div class="login-card">
            <div class="top-bar">
                <div class="brand">DTm</div>
                <a href="index.html" class="home-link">â† Home</a>
            </div>

            <h1>Welcome back</h1>
            <p class="subtitle">Enter </p>

            <div class="role-switch" aria-label="Choose role">
                <!-- <button type="button" class="role-btn active" data-role="member">umuFamilie</button> -->
                <button type="button" class="role-btn" data-role="umukomite">Umukomite</button>
            </div>

            <form id="loginForm">
                <div>
                    <label for="name">Your name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div>
                    <label for="pass">Password</label>
                    <input type="password" id="pass" placeholder="Enter password" required>
                </div>

                <label class="reminder-choice" for="enableReminders">
                    <input type="checkbox" id="enableReminders">
                    <span>Send this device a reminder every 3 months to check for something new. On iPhone or iPad, add the website to your Home Screen first.</span>
                </label>

                <button type="submit" class="submit-btn">Continue</button>
            </form>

            <p class="status-text" id="loginStatus" role="status" aria-live="polite"> hitamo aho kwinjira neza</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://fedwjrefdabcbbklaafz.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wL7XncIhcH0fqjL_Mxo4Lg_U5z_2edi";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const roleButtons = document.querySelectorAll('.role-btn');
        const loginForm = document.getElementById('loginForm');
        const nameInput = document.getElementById('name');
        const passInput = document.getElementById('pass');
        const enableRemindersInput = document.getElementById('enableReminders');
        const loginStatus = document.getElementById('loginStatus');
        const public_passkey = localStorage.getItem('password') || 'drama';
        const UMUKOMITE_PASSWORD = 'umu7.2026';
        const pushConfigPromise = fetch('/.netlify/functions/push-config')
            .then(async response => ({ ...await response.json(), ok: response.ok }))
            .catch(() => ({ ok: false, error: 'Push notifications are not configured on the website yet.' }));

        const requestedRole = new URLSearchParams(window.location.search).get('role');
        let selectedRole = requestedRole === 'umukomite' ? 'umukomite' : 'member';
        roleButtons.forEach(button => button.classList.toggle('active', button.dataset.role === selectedRole));

        function getStoredName() {
            try {
                const savedStatus = JSON.parse(localStorage.getItem('status') || '[]');
                if (Array.isArray(savedStatus)) {
                    return String(savedStatus[2] || savedStatus[1] || '').trim();
                }
            } catch (error) {
                console.warn('Could not read saved name:', error);
            }
            return '';
        }

        nameInput.value = localStorage.getItem('dtm_saved_name') || getStoredName();
        enableRemindersInput.checked = localStorage.getItem('dtm_push_reminders_enabled') === 'true';

        async function prepareDevicePushSubscription() {
            if (!('Notification' in window)) {
                throw new Error('This browser cannot receive web push notifications.');
            }
            if (!window.isSecureContext || !('serviceWorker' in navigator) || !('PushManager' in window)) {
                throw new Error('This browser cannot receive web push notifications.');
            }

            const permissionRequest = Notification.requestPermission();
            const [permission, registration, config] = await Promise.all([
                permissionRequest,
                navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready),
                pushConfigPromise
            ]);
            if (permission !== 'granted') throw new Error('Allow notifications in your browser settings to enable reminders.');
            if (!config.ok || !config.publicKey) throw new Error(config.error || 'Push notifications are not configured on the website yet.');

            let subscription = await registration.pushManager.getSubscription();
            if (!subscription) {
                subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: applicationServerKeyBytes(config.publicKey)
                });
            }
            return subscription;
        }

        enableRemindersInput.addEventListener('change', async () => {
            if (!enableRemindersInput.checked) return;
            try {
                await prepareDevicePushSubscription();
                loginStatus.textContent = 'Notifications allowed. Continue to save this device for reminders.';
                loginStatus.dataset.kind = 'success';
            } catch (error) {
                enableRemindersInput.checked = false;
                loginStatus.textContent = error.message;
                loginStatus.dataset.kind = 'error';
            }
        });

        function applicationServerKeyBytes(value) {
            const padding = '='.repeat((4 - value.length % 4) % 4);
            const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            return Uint8Array.from(raw, character => character.charCodeAt(0));
        }

        async function enableQuarterlyReminders() {
            if (!window.isSecureContext || !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
                throw new Error('This browser cannot receive web push notifications.');
            }

            const registration = await navigator.serviceWorker.register('/sw.js');
            if (Notification.permission !== 'granted') throw new Error('Notification permission was not granted. Turn on the reminder option and allow notifications first.');
            const subscription = await registration.pushManager.getSubscription();
            if (!subscription) throw new Error('The device is not subscribed for reminders. Turn the reminder option on again.');

            const saveResponse = await fetch('/.netlify/functions/push-subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subscription: subscription.toJSON() })
            });
            const result = await saveResponse.json();
            if (!saveResponse.ok) throw new Error(result.error || 'Could not save this device for reminders.');
            localStorage.setItem('dtm_push_reminders_enabled', 'true');
        }

        async function disableQuarterlyReminders() {
            const registration = await navigator.serviceWorker.getRegistration('/');
            const subscription = await registration?.pushManager.getSubscription();
            if (subscription) {
                const response = await fetch('/.netlify/functions/push-unsubscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ endpoint: subscription.endpoint })
                });
                if (!response.ok) throw new Error('Could not remove this device from the reminder list.');
                await subscription.unsubscribe();
            }
            localStorage.removeItem('dtm_push_reminders_enabled');
        }

        async function finishLogin(name, role, destination) {
            const savedStatus = JSON.parse(localStorage.getItem('status') || '[]');
            const status = Array.isArray(savedStatus) ? savedStatus : [];
            status[0] = 'old';
            status[1] = 'active';
            status[2] = name;
            localStorage.setItem('status', JSON.stringify(status));
            localStorage.setItem('dtm_saved_name', name);
            localStorage.setItem('dtm_profile', JSON.stringify({ name, role, savedAt: new Date().toISOString() }));
            if (role !== 'umukomite') sessionStorage.removeItem('dtm_manager_session');
            recordLogin(name, role);
            passInput.value = '';

            if (enableRemindersInput.checked) {
                loginStatus.textContent = 'Saving your login and enabling remindersâ€¦';
                loginStatus.dataset.kind = 'success';
                try {
                    await enableQuarterlyReminders();
                } catch (error) {
                    console.warn('Could not enable quarterly reminders:', error.message);
                    loginStatus.textContent = `Login saved. Reminders were not enabled: ${error.message}`;
                    loginStatus.dataset.kind = 'error';
                    await new Promise(resolve => setTimeout(resolve, 1800));
                }
            } else if (localStorage.getItem('dtm_push_reminders_enabled') === 'true') {
                try {
                    await disableQuarterlyReminders();
                    loginStatus.textContent = 'Three-month reminders turned off for this device.';
                    loginStatus.dataset.kind = 'success';
                } catch (error) {
                    console.warn('Could not disable quarterly reminders:', error.message);
                }
            }
            window.location.href = destination;
        }

        async function recordLogin(name, role) {
            const record = {
                name: String(name || 'Unknown').trim() || 'Unknown',
                role,
                logged_in_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient
                    .from('login_activity')
                    .insert(record);

                if (!error) {
                    console.log('Saved login to Supabase');
                }
            } catch (error) {
                console.warn('Supabase login save failed, using browser fallback:', error);
            }

            try {
                const logs = JSON.parse(localStorage.getItem('dtm_login_log') || '[]');
                const validLogs = Array.isArray(logs) ? logs : [];
                validLogs.push(record);
                localStorage.setItem('dtm_login_log', JSON.stringify(validLogs.slice(-500)));
            } catch (error) {
                console.warn('Could not save login log locally:', error);
            }
        }

        roleButtons.forEach((button) => {
            button.addEventListener('click', () => {
                selectedRole = button.dataset.role;
                roleButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
            });
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const password = passInput.value.trim();

            if (!name || !password) {
                alert('Please enter your name and password.');
                return;
            }

            if (selectedRole === 'member') {
                if (public_passkey && public_passkey === password) {
                    await finishLogin(name, 'member', 'store.html');
                    return;
                }

                alert('Incorrect member password.');
                return;
            }

            if (password !== UMUKOMITE_PASSWORD) {
                loginStatus.textContent = 'Incorrect Umukomite name or password.';
                loginStatus.dataset.kind = 'error';
                return;
            }

            try {
                const response = await fetch('/.netlify/functions/manager-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Could not sign in as Umukomite.');
                sessionStorage.setItem('dtm_manager_session', result.sessionToken);
                await finishLogin(name, 'umukomite', 'umukomite.html');
            } catch (error) {
                loginStatus.textContent = error.message;
                loginStatus.dataset.kind = 'error';
            }
        });
    </script>
</body>

</html>
