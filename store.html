<html lang="en">
<head>

    <meta property="og:description" content="Photos and videos from our family performances and gatherings.">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="./photos/logo.png">

    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #202a34;
            --text: #f3efe7;
            --muted: #b9c2ca;
            --border: #303943;
            --accent: #e6c989;
            --danger: #8f3030;
            --success: #246b58;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", Times, serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 20px;
        }

        nav a { margin: 0; text-decoration: none; }

        button, select, label { font: inherit; }

        .nav-button {
            border: 0;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: opacity .2s ease, transform .2s ease;
        }

        #contributions-button {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(230, 201, 137, .55);
            border-radius: 999px;
            background: #27313b;
            color: #fff2cf;
            font-weight: 700;
            transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
        }

        #contributions-button:hover,
        #contributions-button:focus-visible {
            border-color: var(--accent);
            background: #34424e;
            color: #fff8e5;
            box-shadow: 0 0 0 3px rgba(230, 201, 137, .16);
            outline: none;
        }

        .nav-button:hover {
            opacity: 1;
            transform: none;
        }

        #umukomite-button {
            background: var(--accent);
            color: #111;
        }

        #logout-button {
            background: var(--danger);
            color: white;
        }

        #meeting-button,
        #start-meeting-button {
            background: var(--accent);
            color: #17130d;
        }

        header { padding: 10px 20px 20px; }

        header section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logo {
            width: 90px;
            height: 90px;
            max-width: 100%;
            object-fit: contain;
        }

        #logo-title {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
        }

        #small-title {
            display: block;
            margin-top: 3px;
            font-size: .65rem;
        }

        #welcome {
            margin: 15px 0 0;
            font-size: clamp(1.2rem, 3vw, 1.7rem);
        }

        #title.new::after {
            content: ", here you can check all photos you want from drama team family";
        }

        #title.new, #welcome.new { font-size: 15px; }

        main {
            position: relative;
            padding: 0 12px 30px;
        }

        #tools {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 15px;
            font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
                sans-serif;
        }

        #primaryTools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        #media-tabs { display: flex; align-items: center; gap: 8px; }

        button.input-button.media-tab {
            border: 1px solid #46515d;
            background: var(--surface-2);
            color: var(--text);
            transition: background .2s ease, box-shadow .2s ease, color .2s ease;
        }

        .media-tab[aria-selected="true"] {
            border-color: #167448;
            background: #075b35;
            color: #f3fff7;
            box-shadow: 0 0 0 2px rgba(196, 255, 215, .45), 0 3px 12px rgba(122, 255, 173, .28);
        }

        #uploadControl { margin-left: auto; gap: 8px; }

        #secondaryTools {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 24px;
        }

        .tool {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-button {
            display: inline-block;
            background: var(--accent);
            color: #17130d;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .input-button.disabled {
            cursor: wait;
            opacity: .55;
        }

        [hidden] { display: none !important; }

        button.input-button {
            border: 0;
            font-weight: 700;
        }

        select {
            background: #0d1117;
            color: var(--text);
            border: 1px solid #46515d;
            border-radius: 8px;
            padding: 5px 8px;
            cursor: pointer;
        }

        input[type="text"] {
            width: min(220px, 45vw);
            background: #0d1117;
            color: var(--text);
            border: 1px solid #46515d;
            border-radius: 8px;
            padding: 6px 8px;
            font: inherit;
        }

        #container {
            min-height: 400px;
            margin: 0;
            padding: 20px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            align-content: start;
        }

        #videoContainer {
            min-height: 400px;
            margin: 0;
            padding: 20px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            align-content: start;
        }

        #container.large-view {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        #container.title-view {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .gallery-item {
            min-width: 0;
            overflow: hidden;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid #2e2e2e;
            transition: none;
        }

        .gallery-item:hover {
            transform: none;
            border-color: #2e2e2e;
        }

        .image-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #0c0c0c;
        }

        .gallery-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: none;
        }

        .gallery-item:hover .gallery-image { transform: none; }

        .file-info {
            padding: 2px 10px 10px;
            color: var(--muted);
            font: 10px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .file-meta {
            margin-top: 3px;
            color: #888;
            font-size: 10px;
        }

        #container.title-view .gallery-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
        }

        .media-group {
            grid-column: 1 / -1;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #111820;
        }

        .media-group-summary {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            color: var(--text);
            cursor: pointer;
            list-style: none;
            font: 700 15px/1.4 system-ui, sans-serif;
        }

        .media-group-summary::-webkit-details-marker { display: none; }
        .media-group-summary::marker { content: ""; }
        .media-group-summary::after {
            content: "+";
            margin-left: auto;
            color: #b7e7c8;
            font-size: 20px;
        }

        .media-group[open] > .media-group-summary::after { content: "-"; }

        .media-group-count {
            color: var(--muted);
            font-size: 12px;
            font-weight: 400;
        }

        .media-group-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            align-items: start;
            gap: 18px;
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        #videoContainer .media-group-items {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        #container.large-view .media-group-items {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        #container.title-view .media-group-items {
            display: flex;
            flex-direction: column;
        }

        .media-group-more {
            display: grid;
            place-content: center;
            gap: 5px;
            min-width: 0;
            min-height: 100px;
            padding: 12px;
            border: 1px dashed #687784;
            border-radius: 10px;
            background: #1a2630;
            color: #eaf4ec;
            font: 700 14px/1.3 system-ui, sans-serif;
            text-align: center;
            cursor: pointer;
        }

        .media-group-more:hover { background: #24343e; }
        .media-group-more-count { color: var(--muted); font-size: 12px; font-weight: 400; }
        .video-group .media-group-more { aspect-ratio: 16 / 9; }

        #container.title-view .image-frame {
            flex: 0 0 90px;
            width: 90px;
            aspect-ratio: 4 / 3;
            border-radius: 7px;
        }

        #container.title-view .file-info {
            padding: 0;
        }

        #defaults {
            grid-column: 1 / -1;
            margin: auto;
            color: #e1f8f8;
            font-size: 14px;
            text-align: center;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            margin: auto;
            color: #e1f8f8;
            font-size: 14px;
            text-align: center;
        }

        .broken-image {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            color: #888;
            font: 12px system-ui, sans-serif;
            text-align: center;
            padding: 10px;
        }

        .image-placeholder {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            color: #888;
            font: 12px system-ui, sans-serif;
            text-align: center;
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #080a0d;
        }

        .video-frame video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-view-button {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, .45);
            border-radius: 7px;
            padding: 5px 9px;
            background: rgba(13, 17, 23, .85);
            color: white;
            cursor: pointer;
        }

        .video-load-button {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 999px;
            padding: 10px 16px;
            background: rgba(13, 17, 23, .88);
            color: white;
            font: inherit;
            cursor: pointer;
        }

        .video-load-button:disabled {
            cursor: wait;
            opacity: .8;
        }

        #videoUploadStatus {
            gap: 8px;
            min-width: min(320px, 100%);
        }

        #videoProgress { width: 120px; accent-color: var(--accent); }

        #videoProgressText {
            color: var(--muted);
            font-size: 12px;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 58px 70px 32px;
            background: rgba(0, 0, 0, .92);
        }

        .modal.hidden { display: none; }

        #modalViewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(100%, 1200px);
            max-height: 100%;
            touch-action: pan-y;
        }

        #zoomedImage {
            display: block;
            max-width: 95vw;
            max-height: 82vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 1px solid var(--accent);
            border-radius: 20px;
        }

        #zoomedVideo {
            display: block;
            width: min(90vw, 1100px);
            max-height: 82vh;
            aspect-ratio: 16 / 9;
            background: #080a0d;
            border: 1px solid var(--accent);
            border-radius: 12px;
            object-fit: contain;
        }

        #mediaCaption {
            max-width: 90vw;
            margin: 10px 0 0;
            color: white;
            font: 15px/1.4 system-ui, sans-serif;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #uploadTitle.invalid { border-color: #d66; }

        .modal-nav {
            position: absolute;
            top: 50%;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 48px;
            height: 56px;
            transform: translateY(-50%);
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 10px;
            background: rgba(20, 25, 30, .78);
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .modal-nav:hover { background: rgba(50, 60, 68, .95); }
        #previousMedia { left: 16px; }
        #nextMedia { right: 16px; }

        #close {
            position: absolute;
            top: 15px;
            right: 25px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 45px;
            line-height: 1;
            cursor: pointer;
        }

        #close:hover { color: #ddd; }

        #downloadImage {
            position: absolute;
            top: 20px;
            right: 82px;
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            background: #d3d3d3;
            color: #111;
            font-weight: 700;
            cursor: pointer;
        }

        #downloadImage:disabled {
            cursor: wait;
            opacity: .65;
        }

        @media (max-width: 600px) {
            nav { padding: 10px; }
            header { padding-inline: 10px; }
            #logo { width: 70px; height: 70px; }
            #container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 8px; }
            #videoContainer { grid-template-columns: 1fr; gap: 10px; padding: 12px 8px; }
            #videoContainer .media-group-items { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
            #container .media-group-items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px; }
            .media-group-more { min-height: 90px; padding: 8px; font-size: 12px; }
            #container.large-view { grid-template-columns: 1fr; }
            #container.large-view .media-group-items { grid-template-columns: 1fr; }
            nav { justify-content: center; }
            #primaryTools { gap: 4px; }
            #media-tabs { gap: 4px; }
            #media-tabs .input-button { padding: 6px; }
            #uploadControl { gap: 4px; }
            #titleInputLabel { display: none; }
            #uploadTitle { width: min(90px, 26vw); }
            .modal { padding: 58px 54px 24px; }
            #zoomedImage { max-width: 100%; max-height: 78vh; }
            #zoomedVideo { width: min(100%, 90vw); max-height: 78vh; }
            .modal-nav { width: 40px; height: 48px; font-size: 25px; }
            #previousMedia { left: 6px; }
            #nextMedia { right: 6px; }
            #close { top: 10px; right: 15px; font-size: 38px; }
            #downloadImage { top: 14px; right: 62px; padding: 8px 10px; }
            .file-info { font-size: 10px; }
        }
    </style>
</head>

<body>
    <nav>
        <a href="contributions.html" class="nav-button" id="contributions-button">Contributions</a>
        <a href="login.html?role=umukomite" class="nav-button" id="umukomite-button">Umukomite</a>
        <a href="index.html" class="nav-button" id="logout-button">Log Out</a>
    </nav>

    <header>
        <section>
            <img src="./photos/logo.png" alt="Drama Team logo" id="logo">
            <p id="logo-title">
                DRAMA TEAM Family
                <small id="small-title"><strong>Guardian of heaven</strong></small>
            </p>
        </section>

        <h2 id="welcome">
            <span id="great">Welcome back</span>
            <span id="title">...</span>
        </h2>
    </header>

    <main>
        <div id="tools">
            <div id="primaryTools">
                <div class="tool" id="media-tabs" role="tablist" aria-label="Gallery media">
                    <button type="button" class="input-button media-tab" id="photosTab" role="tab" aria-selected="true" aria-controls="container">Photos</button>
                    <button type="button" class="input-button media-tab" id="videosTab" role="tab" aria-selected="false" aria-controls="videoContainer">Video</button>
                </div>

                <div class="tool" id="uploadControl">
                    <label for="uploadTitle" id="titleInputLabel">Upload title *</label>
                    <input type="text" id="uploadTitle" maxlength="255" placeholder="Required group title" aria-label="Required upload group title" required>
                    <input type="file" id="input" accept="image/*,video/*" multiple hidden>
                    <button type="button" class="input-button" id="uploadLabel" title="Upload photos and videos">Upload</button>
                </div>
            </div>

            <div id="secondaryTools">
                <div class="tool">
                    <button type="button" class="input-button" id="start-meeting-button" title="Start live meeting for drama team family">Start Meeting</button>
                </div>

                <div class="tool" id="sortControl">
                    <label for="sort">Sort</label>
                    <select id="sort">
                        <option value="new">New</option>
                        <option value="older">Older</option>
                        <option value="size">Size</option>
                    </select>
            </div>

                <div class="tool" id="videoUploadStatus" role="status" aria-live="polite" hidden>
                    <progress id="videoProgress" max="100" value="0"></progress>
                    <span id="videoProgressText"></span>
                </div>

                <div class="tool" id="viewControl">
                    <label for="view" id="viewLabel">View</label>
                    <select id="view">
                        <option value="grid">Grid</option>
                        <option value="large">Large</option>
                        <option value="title">Small</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="container" role="tabpanel" aria-labelledby="photosTab" aria-live="polite">
            <p id="defaults">Nothing to show...</p>
        </div>
        <div id="videoContainer" role="tabpanel" aria-labelledby="videosTab" aria-live="polite" hidden>
            <p id="videoDefaults" class="gallery-empty">Loading videos...</p>
        </div>
    </main>

    <div id="imageModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Media preview">
        <button type="button" id="downloadImage" title="Download this image">Download</button>
        <button type="button" id="close" aria-label="Close image preview">&times;</button>
        <button type="button" class="modal-nav" id="previousMedia" aria-label="Previous media">&#10094;</button>
        <div id="modalViewer">
            <img id="zoomedImage" alt="Selected image preview">
            <video id="zoomedVideo" controls playsinline hidden></video>
            <p id="mediaCaption"></p>
        </div>
        <button type="button" class="modal-nav" id="nextMedia" aria-label="Next media">&#10095;</button>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

        localStorage.setItem('active','active')
         
        "use strict";

        const SUPABASE_URL = "https://fedwjrefdabcbbklaafz.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wL7XncIhcH0fqjL_Mxo4Lg_U5z_2edi";
        const BUCKET_NAME = "photos";
        const MAX_VIDEO_FILE_SIZE = 5 * 1024 * 1024 * 1024;
        const MAX_FILE_SIZE = 10 * 1024 * 1024;

        const supabaseClient = window.supabase?.createClient?.(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        ) || null;
        if (!supabaseClient) {
            const photosStatus = document.getElementById("defaults");
            const videosStatus = document.getElementById("videoDefaults");
            if (photosStatus) photosStatus.textContent = "The gallery service could not load. Please try again shortly.";
            if (videosStatus) videosStatus.textContent = "The gallery service could not load. Please try again shortly.";
            document.querySelectorAll("#tools button:not(#start-meeting-button), #tools select").forEach(control => { control.disabled = true; });
            document.getElementById("start-meeting-button")?.addEventListener("click", () => { window.location.href = "meeting.html"; });
            document.getElementById("logout-button")?.addEventListener("click", () => {
                localStorage.removeItem("active");
                localStorage.removeItem("status");
                sessionStorage.removeItem("dtm_manager_session");
            });
            return;
        }

        const input = document.getElementById("input");
        const uploadTitleInput = document.getElementById("uploadTitle");
        const uploadLabel = document.getElementById("uploadLabel");
        const videoUploadStatus = document.getElementById("videoUploadStatus");
        const videoProgress = document.getElementById("videoProgress");
        const videoProgressText = document.getElementById("videoProgressText");
        const startMeetingButton = document.getElementById("start-meeting-button");
        const container = document.getElementById("container");
        const videoContainer = document.getElementById("videoContainer");
        const photosTab = document.getElementById("photosTab");
        const videosTab = document.getElementById("videosTab");
        const sortControl = document.getElementById("sortControl");
        const viewControl = document.getElementById("viewControl");
        const sortSelect = document.getElementById("sort");
        const viewSelect = document.getElementById("view");
        const imageModal = document.getElementById("imageModal");
        const modalViewer = document.getElementById("modalViewer");
        const zoomedImage = document.getElementById("zoomedImage");
        const zoomedVideo = document.getElementById("zoomedVideo");
        const mediaCaption = document.getElementById("mediaCaption");
        const previousMediaButton = document.getElementById("previousMedia");
        const nextMediaButton = document.getElementById("nextMedia");
        const downloadImageButton = document.getElementById("downloadImage");
        const closeButton = document.getElementById("close");
        const logoutButton = document.getElementById("logout-button");
        const great = document.getElementById("great");
        const title = document.getElementById("title");

        let galleryItems = [];
        let videoItems = [];

        function formatFileSize(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return "Unknown size";
            const units = ["B", "KB", "MB", "GB"];
            const index = Math.min(
                Math.floor(Math.log(bytes) / Math.log(1024)),
                units.length - 1
            );
            return `${(bytes / 1024 ** index).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
        }

        function safeFileName(name) {
            return name
                .normalize("NFKD")
                .replace(/[^\w.\-]+/g, "-")
                .replace(/-+/g, "-")

                .toLowerCase() || "image";

        function fileNameWithTitle(fileName, title) {

            if (!cleanTitle) return fileName;
            const titleWithoutExtension = extension && cleanTitle.toLowerCase().endsWith(extension.toLowerCase())
                ? cleanTitle.slice(0, -extension.length)
                : cleanTitle;
            return `${titleWithoutExtension}${extension}`;
        }

        async function createThumbnail(blob) {
            if (!("createImageBitmap" in window)) {
                throw new Error("This browser cannot create thumbnails. Try a recent version of Chrome, Edge, or Firefox.");
            }

            const bitmap = await createImageBitmap(blob);
            const width = 480;
            const height = 360;
            const scale = Math.max(width / bitmap.width, height / bitmap.height);
            const cropWidth = width / scale;
            const cropHeight = height / scale;
            const cropX = (bitmap.width - cropWidth) / 2;
            const cropY = (bitmap.height - cropHeight) / 2;
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");
            if (!context) {
                bitmap.close();
                throw new Error("Could not create a thumbnail canvas.");
            }

            context.drawImage(bitmap, cropX, cropY, cropWidth, cropHeight, 0, 0, width, height);
            bitmap.close();

            const thumbnail = await new Promise(resolve =>
                canvas.toBlob(resolve, "image/webp", 0.68)
            );
            if (!thumbnail) throw new Error("Could not encode the thumbnail as WebP.");
            return thumbnail;
        }

        function waitForVideoEvent(video, readyEvent, timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                const cleanup = () => {
                    clearTimeout(timeout);
                    video.removeEventListener(readyEvent, onReady);
                    video.removeEventListener("error", onError);
                };
                const onReady = () => {
                    cleanup();
                    resolve();
                };
                const onError = () => {
                    cleanup();
                    reject(new Error("This video format could not be previewed in this browser."));
                };
                const timeout = setTimeout(() => {
                    cleanup();
                    reject(new Error("Timed out while preparing the video preview."));
                }, timeoutMs);
                video.addEventListener(readyEvent, onReady, { once: true });
                video.addEventListener("error", onError, { once: true });
            });
        }

        async function createVideoThumbnail(file) {
            const objectUrl = URL.createObjectURL(file);
            const video = document.createElement("video");
            video.preload = "metadata";
            video.muted = true;
            video.playsInline = true;

            try {
                const metadataReady = waitForVideoEvent(video, "loadedmetadata");
                video.src = objectUrl;
                video.load();
                await metadataReady;
                if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                    const firstFrameReady = waitForVideoEvent(video, "loadeddata");
                    await firstFrameReady;
                }

                const targetTime = Number.isFinite(video.duration) && video.duration > 0
                    ? Math.min(1, video.duration / 2)
                    : 0;
                if (targetTime > 0) {
                    video.currentTime = targetTime;
                    await waitForVideoEvent(video, "seeked");
                }

                if (!video.videoWidth || !video.videoHeight) {
                    throw new Error("The video has no previewable frame.");
                }

                const width = 480;
                const height = 270;
                const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
                const cropWidth = width / scale;
                const cropHeight = height / scale;
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const context = canvas.getContext("2d");
                if (!context) throw new Error("Could not create a video preview canvas.");

                context.drawImage(
                    video,
                    (video.videoWidth - cropWidth) / 2,
                    (video.videoHeight - cropHeight) / 2,
                    cropWidth,
                    cropHeight,
                    0,
                    0,
                    width,
                    height
                );

                const thumbnail = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.82));
                if (!thumbnail) throw new Error("Could not encode the video preview.");
                return thumbnail;
            } finally {
                video.pause();
                video.removeAttribute("src");
                video.load();
                URL.revokeObjectURL(objectUrl);
            }
        }

        async function sha256File(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function isStorageObjectAvailable(storagePath) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(getPublicUrl(storagePath), {
                    method: "HEAD",
                    cache: "no-store",
                    signal: controller.signal
                });
                return response.ok ? true : response.status >= 500 ? null : false;
            } catch (error) {
                console.warn("Could not verify photo storage object:", storagePath, error);
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function validatePhotoCardsAfterRender() {
            const cards = Array.from(container.querySelectorAll(".gallery-item[data-storage-path]"));
            const targets = cards.filter(card => {
                const path = card.dataset.storagePath;
                if (!path || photoAvailabilityCache.has(path) || photoChecksInProgress.has(path)) return false;
                photoChecksInProgress.add(path);
                return true;
            });
            let nextIndex = 0;

            const worker = async () => {
                while (nextIndex < targets.length) {
                    const card = targets[nextIndex++];
                    const path = card.dataset.storagePath;
                    const available = await isStorageObjectAvailable(path);
                    photoChecksInProgress.delete(path);
                    if (available === null) continue;
                    photoAvailabilityCache.set(path, available);
                    if (available) continue;

                    galleryItems = galleryItems.filter(item => item.storage_path !== path);
                    displayedGalleryItems = displayedGalleryItems.filter(item => item.storage_path !== path);
                    for (const matchingCard of container.querySelectorAll(".gallery-item[data-storage-path]")) {
                        if (matchingCard.dataset.storagePath === path) {
                            const group = matchingCard.closest(".media-group");
                            matchingCard.remove();
                            if (group && !group.querySelector(".gallery-item")) group.remove();
                        }
                    }
                }
            };

            await Promise.all(Array.from({ length: Math.min(8, targets.length) }, worker));
            if (!container.querySelector(".gallery-item") && galleryItems.length === 0) {
                renderGallery([]);
            }
        }

        const playableVideoUrls = new Map();
        const pendingVideoUrlRequests = new Map();

        async function getPlayableVideoUrl(fileKey) {
            const cached = playableVideoUrls.get(fileKey);
            if (cached && cached.expiresAt > Date.now()) return cached.url;
            if (pendingVideoUrlRequests.has(fileKey)) return pendingVideoUrlRequests.get(fileKey);

            const request = (async () => {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-upload-url`, {
                    method: "POST",
                    headers: {
                        apikey: SUPABASE_PUBLISHABLE_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ action: "watch", fileKey })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || `Could not prepare playback (${response.status}).`);
                if (typeof result.watchUrl !== "string" || !result.watchUrl) {
                    throw new Error("The video playback URL was empty.");
                }
                playableVideoUrls.set(fileKey, {
                    url: result.watchUrl,
                    expiresAt: Date.now() + (3.5 * 60 * 60 * 1000)
                });
                return result.watchUrl;
            })();

            pendingVideoUrlRequests.set(fileKey, request);
            try {
                return await request;
            } finally {
                if (pendingVideoUrlRequests.get(fileKey) === request) {
                    pendingVideoUrlRequests.delete(fileKey);
                }
            }
        }

                const result = await response.json().catch(() => ({}));

        function putVideoFile(url, file, onProgress) {
            return new Promise((resolve, reject) => {
                const request = new XMLHttpRequest();
                request.open("PUT", url);
                request.setRequestHeader("Content-Type", file.type);
                request.upload.addEventListener("progress", event => {
                    if (event.lengthComputable) onProgress(event.loaded, event.total);
                });
                request.addEventListener("load", () => {
                    if (request.status >= 200 && request.status < 300) resolve();
                    else reject(new Error(`B2 upload failed (${request.status}). Check the bucket CORS rule and try again.`));
                });
                request.addEventListener("error", () => reject(new Error("Video upload failed. Check your connection and the B2 bucket CORS settings.")));
                request.addEventListener("abort", () => reject(new Error("Video upload was cancelled.")));
                request.send(file);
            });
        }

        async function createVideoFingerprint(file, onProgress) {
            const chunkSize = 16 * 1024 * 1024;
            const chunkCount = Math.ceil(file.size / chunkSize);
            const chunkDigests = [];

            for (let offset = 0; offset < file.size; offset += chunkSize) {
                const chunk = await file.slice(offset, Math.min(offset + chunkSize, file.size)).arrayBuffer();
                chunkDigests.push(new Uint8Array(await crypto.subtle.digest("SHA-256", chunk)));
                onProgress(chunkDigests.length, chunkCount);
            }

            const prefix = new TextEncoder().encode(`DTM_VIDEO_FINGERPRINT_V1:${file.size}:`);
            const fingerprintBytes = new Uint8Array(prefix.length + chunkDigests.length * 32);
            fingerprintBytes.set(prefix);
            chunkDigests.forEach((digest, index) => fingerprintBytes.set(digest, prefix.length + index * 32));

            const fingerprint = await crypto.subtle.digest("SHA-256", fingerprintBytes);
            return Array.from(new Uint8Array(fingerprint))
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function findExistingVideoByHash(fileHash) {
            const { data, error } = await supabaseClient
                .from("videos")
                .select("id, title")
                .eq("file_hash", fileHash)
                .maybeSingle();

            if (error) throw new Error(`Video duplicate check failed: ${error.message}`);
            return data;
        }

        async function uploadVideo(file, title, groupTitle, index, total) {
            if (!file.type.startsWith("video/")) {
                throw new Error(`${file.name} is not a recognized video file.`);
            }
            if (file.size > MAX_VIDEO_FILE_SIZE) {
                throw new Error(`${file.name} is larger than 5 GB.`);
            }

            videoProgress.value = 0;
            videoUploadStatus.hidden = false;
            videoProgressText.textContent = `Checking for duplicate ${index}/${total}: ${file.name}`;

            const fileHash = await createVideoFingerprint(file, (completed, chunks) => {
                videoProgress.value = Math.round((completed / chunks) * 100);
                videoProgressText.textContent = `Checking ${index}/${total}: ${file.name} (${videoProgress.value}%)`;
            });
            if (await findExistingVideoByHash(fileHash)) {
                return { duplicate: true };
            }

            videoProgress.value = 0;
            videoProgressText.textContent = `Creating preview ${index}/${total}: ${file.name}`;
            let thumbnailPath = null;
            try {
                const thumbnail = await createVideoThumbnail(file);
                const candidatePath = `video-thumbnails/${crypto.randomUUID()}.jpg`;
                const { error: thumbnailError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(candidatePath, thumbnail, {
                        cacheControl: "31536000",
                        contentType: "image/jpeg",
                        upsert: false
                    });
                if (thumbnailError) throw thumbnailError;
                thumbnailPath = candidatePath;
            } catch (error) {
                console.warn(`Could not save a preview for ${file.name}:`, error);
            }

            try {
                const upload = await requestVideoUploadUrl(file, title, groupTitle);
                await putVideoFile(upload.uploadUrl, file, (loaded, size) => {
                    videoProgress.value = Math.round((loaded / size) * 100);
                    videoProgressText.textContent = `Uploading ${index}/${total}: ${file.name} (${videoProgress.value}%)`;
                });

                const { error } = await supabaseClient.from("videos").insert({
                    title: upload.title,
                    group_title: groupTitle,
                    file_key: upload.fileKey,
                    file_hash: fileHash,
                    thumbnail_path: thumbnailPath
                });
                if (error) throw new Error(`Video uploaded, but could not save its gallery record: ${error.message}`);
            } catch (error) {
                if (thumbnailPath) {
                    await supabaseClient.storage.from(BUCKET_NAME).remove([thumbnailPath]).catch(() => {});
                }
                throw error;
            }

            return { duplicate: false, hasPreview: Boolean(thumbnailPath) };
        }

        function applyView(viewType) {
            container.classList.remove("large-view", "title-view");
            if (viewType === "large") container.classList.add("large-view");
            if (viewType === "title") container.classList.add("title-view");
        }

        viewSelect.addEventListener("change", event => applyView(event.target.value));
        sortSelect.addEventListener("change", event => sortGallery(event.target.value));

        async function uploadFile(file, displayTitle, groupTitle) {
            if (!file.type.startsWith("image/")) {
                throw new Error(`${file.name} is not an image.`);
            }

            if (file.size > MAX_FILE_SIZE) {
                throw new Error(`${file.name} is larger than ${formatFileSize(MAX_FILE_SIZE)}.`);
            }

            // Hash the actual bytes. The filename does NOT matter.
            const fileHash = await sha256File(file);

            // First check prevents an unnecessary storage upload in normal cases.
            const existing = await findExistingByHash(fileHash);

            if (existing) {
                return {
                    duplicate: true,
                    existing: {
                        ...existing,
                        url: getPublicUrl(existing.storage_path),
                        thumbnailUrl: getThumbnailUrl(existing.storage_path),
                        year: detectYear(existing.file_name)
                    }
                };
            }

            const thumbnail = await createThumbnail(file);

            const storagePath = createStoragePath(file);

            const { error: storageError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(storagePath, file, {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                });

            if (storageError) {
                throw new Error(`Storage upload failed for ${file.name}: ${storageError.message}`);
            }

            const thumbnailPath = getThumbnailPath(storagePath);
            const { error: thumbnailError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(thumbnailPath, thumbnail, {
                    cacheControl: "31536000",
                    upsert: false,
                    contentType: "image/webp"
                });

            if (thumbnailError) {
                await supabaseClient.storage.from(BUCKET_NAME).remove([storagePath]);
                throw new Error(`Thumbnail upload failed for ${file.name}: ${thumbnailError.message}`);
            }

            // The UNIQUE(file_hash) constraint is the final protection against
            // two people uploading the same file simultaneously.
            const { data: record, error: databaseError } = await supabaseClient
                .from("photos")
                .insert({
                    file_name: fileNameWithTitle(file.name, displayTitle),
                    group_title: groupTitle,
                    storage_path: storagePath,
                    uploaded_by: "anonymous",
                    file_hash: fileHash,
                    file_size: file.size
                })
                .select()
                .single();

            if (databaseError) {
                // If another upload won the race, our storage object is unnecessary.
                await supabaseClient.storage.from(BUCKET_NAME).remove([storagePath, thumbnailPath]);

                if (databaseError.code === "23505") {
                    const winner = await findExistingByHash(fileHash);
                    if (winner) {
                        return {
                            duplicate: true,
                            existing: {
                                ...winner,
                                url: getPublicUrl(winner.storage_path),
                                thumbnailUrl: getThumbnailUrl(winner.storage_path),
                                year: detectYear(winner.file_name)
                            }
                        };
                    }
                }

                throw new Error(`Database save failed for ${file.name}: ${databaseError.message}`);
            }

            return {
                duplicate: false,
                ...record,
                url: getPublicUrl(storagePath),
                thumbnailUrl: getThumbnailUrl(storagePath),
                year: detectYear(file.name)
            };
        }

        function getUploadKind(file) {
            if (file.type.startsWith("image/")) return "image";
            if (file.type.startsWith("video/")) return "video";

            const extension = file.name.split(".").pop().toLowerCase();
            if (["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "heic", "heif"].includes(extension)) return "image";
            if (["mp4", "m4v", "mov", "webm", "ogv", "ogg", "avi", "mkv", "3gp", "mpeg", "mpg"].includes(extension)) return "video";
            return "";
        }

        function normalizeUploadFile(file, kind) {
            if (file.type.startsWith(`${kind}/`)) return file;

            const extension = file.name.split(".").pop().toLowerCase();
            const knownTypes = {
                jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif",
                webp: "image/webp", avif: "image/avif", bmp: "image/bmp", heic: "image/heic", heif: "image/heif",
                mp4: "video/mp4", m4v: "video/x-m4v", mov: "video/quicktime", webm: "video/webm",
                ogv: "video/ogg", ogg: "video/ogg", avi: "video/x-msvideo", mkv: "video/x-matroska",
                "3gp": "video/3gpp", mpeg: "video/mpeg", mpg: "video/mpeg"
            };
            const type = knownTypes[extension];
            return type ? new File([file], file.name, { type }) : file;
        }

        input.addEventListener("change", async event => {
            const selectedFiles = Array.from(event.target.files || []);
            if (!selectedFiles.length) return;

            const selectedTitle = requireUploadTitle();
            if (!selectedTitle) {
                input.value = "";
                return;
            }

            const mediaFiles = selectedFiles.map(file => ({ file, kind: getUploadKind(file) }));
            const videoCount = mediaFiles.filter(item => item.kind === "video").length;
            let videoIndex = 0;
            let uploadedPhotos = 0;
            let uploadedVideos = 0;
            let duplicates = 0;
            let previewsMissing = 0;
            const failed = [];

            document.body.style.cursor = "progress";
            input.disabled = true;
            uploadTitleInput.disabled = true;
            uploadLabel.disabled = true;
            uploadLabel.classList.add("disabled");
            uploadLabel.textContent = "Uploading...";
            uploadLabel.setAttribute("aria-busy", "true");
            uploadLabel.setAttribute("aria-disabled", "true");

            for (const { file, kind } of mediaFiles) {
                if (!kind) {
                    failed.push(`${file.name}: unsupported file type`);
                    continue;
                }

                const uploadFileObject = normalizeUploadFile(file, kind);
                try {
                    if (kind === "image") {
                        const photoTitle = selectedFiles.length === 1 ? selectedTitle : "";
                        const result = await uploadFile(uploadFileObject, photoTitle, selectedTitle);
                        if (result.duplicate) {
                            duplicates++;
                        } else {
                            galleryItems.unshift(result);
                            uploadedPhotos++;
                        }
                        continue;
                    }

                    videoIndex++;
                    videoUploadStatus.hidden = false;
                    const videoTitle = videoCount === 1 && selectedTitle
                        ? selectedTitle
                        : file.name.replace(/\.[^.]+$/, "");
                    const outcome = await uploadVideo(uploadFileObject, videoTitle, selectedTitle, videoIndex, videoCount);
                    if (outcome.duplicate) {
                        duplicates++;
                        continue;
                    }
                    uploadedVideos++;
                    if (!outcome.hasPreview) previewsMissing++;
                } catch (error) {
                    console.error(error);
                    failed.push(`${file.name}: ${error.message}`);
                }
            }

            if (mediaFiles.some(item => item.kind === "image")) sortGallery(sortSelect.value);
            if (videoCount) await loadVideos();

            document.body.style.cursor = "";
            input.disabled = false;
            uploadTitleInput.disabled = false;
            uploadLabel.disabled = false;
            uploadLabel.classList.remove("disabled");
            uploadLabel.removeAttribute("aria-disabled");
            uploadLabel.removeAttribute("aria-busy");
            uploadLabel.textContent = "Upload";
            input.value = "";
            uploadTitleInput.value = "";
            uploadTitleInput.setCustomValidity("");
            uploadTitleInput.classList.remove("invalid");
            videoUploadStatus.hidden = true;

            const summary = [];
            if (uploadedPhotos) summary.push(`${uploadedPhotos} photo${uploadedPhotos === 1 ? "" : "s"} uploaded`);
            if (uploadedVideos) summary.push(`${uploadedVideos} video${uploadedVideos === 1 ? "" : "s"} uploaded`);
            if (duplicates) summary.push(`${duplicates} duplicate${duplicates === 1 ? "" : "s"} skipped`);
            if (previewsMissing) summary.push(`${previewsMissing} video preview${previewsMissing === 1 ? "" : "s"} unavailable`);

            if (failed.length) {
                showMessage(`${summary.join("; ") || "No files uploaded"}; ${failed.length} failed. ${failed.join(" | ")}`, "error");
            } else {
                showMessage(summary.length ? `${summary.join("; ")}.` : "Nothing uploaded.", "success");
            }
        });

        function getViewerItems() {
            return viewerMediaType === "videos" ? videoItems : displayedGalleryItems;
        }

        function showCurrentMedia() {
            const items = getViewerItems();
            if (!items.length) {
                closeImage();
                return;
            }

            viewerMediaIndex = (viewerMediaIndex + items.length) % items.length;
            const item = items[viewerMediaIndex];
            const isVideo = viewerMediaType === "videos";
            const loadToken = ++viewerLoadToken;

            zoomedVideo.pause();
            zoomedVideo.removeAttribute("src");
            zoomedVideo.load();
            zoomedImage.hidden = isVideo;
            zoomedVideo.hidden = !isVideo;
            downloadImageButton.hidden = isVideo;
            previousMediaButton.hidden = items.length < 2;
            nextMediaButton.hidden = items.length < 2;
            mediaCaption.textContent = isVideo
                ? item.title || "Untitled video"
                : getDisplayTitle(item.file_name);

            if (!isVideo) {
                currentStoragePath = item.storage_path;
                currentFileName = item.file_name || "image";
                zoomedImage.alt = mediaCaption.textContent;
                zoomedImage.src = item.url;
                return;
            }

            currentStoragePath = "";
            currentFileName = "";
            getPlayableVideoUrl(item.file_key).then(url => {
                if (loadToken !== viewerLoadToken || imageModal.classList.contains("hidden")) return;
                zoomedVideo.src = url;
                zoomedVideo.title = mediaCaption.textContent;
                zoomedVideo.load();
            }).catch(error => {
                if (loadToken === viewerLoadToken) {
                    console.error("Could not load video preview:", error);
                    showMessage("Could not load this video. Please try again.", "error");
                }
            });
        }

        function openMediaViewer(mediaType, item) {
            viewerMediaType = mediaType;
            if (mediaType === "videos") {
                videoContainer.querySelectorAll("video").forEach(player => player.pause());
            }
            const items = getViewerItems();
            viewerMediaIndex = items.findIndex(candidate => mediaType === "videos"
                ? candidate.id === item.id
                : candidate.storage_path === item.storage_path);
            if (viewerMediaIndex < 0) return;
            imageModal.classList.remove("hidden");
            document.body.style.overflow = "hidden";
            showCurrentMedia();
        }

        function moveMedia(direction) {
            const items = getViewerItems();
            if (items.length < 2) return;
            viewerMediaIndex = (viewerMediaIndex + direction + items.length) % items.length;
            showCurrentMedia();
        }

        downloadImageButton.addEventListener("click", async () => {
            if (!currentStoragePath) return;
            const storagePath = currentStoragePath;
            const fileName = currentFileName;

            downloadImageButton.disabled = true;
            downloadImageButton.textContent = "Downloading...";

            try {
                const { data, error } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .download(storagePath);

                if (error) throw error;

                const downloadUrl = URL.createObjectURL(data);
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
            } catch (error) {
                console.error("Could not download image:", error);
                showMessage("Could not download this image. Please try again.", "error");
            } finally {
                downloadImageButton.disabled = false;
                downloadImageButton.textContent = "Download";
            }
        });

        zoomedImage.addEventListener("error", () => {
            showMessage("Could not load the original image.", "error");
        });

        function closeImage() {
            viewerLoadToken++;
            zoomedVideo.pause();
            zoomedVideo.removeAttribute("src");
            zoomedVideo.load();
            imageModal.classList.add("hidden");
            zoomedImage.removeAttribute("src");
            document.body.style.overflow = "";
        }

        closeButton.addEventListener("click", closeImage);
        previousMediaButton.addEventListener("click", () => moveMedia(-1));
        nextMediaButton.addEventListener("click", () => moveMedia(1));

        modalViewer.addEventListener("pointerdown", event => {
            if (event.pointerType === "touch") touchStartX = event.clientX;
        });

        modalViewer.addEventListener("pointerup", event => {
            if (touchStartX === null) return;
            const distance = event.clientX - touchStartX;
            touchStartX = null;
            if (Math.abs(distance) >= 55) moveMedia(distance < 0 ? 1 : -1);
        });

        modalViewer.addEventListener("pointercancel", () => {
            touchStartX = null;
        });

        imageModal.addEventListener("click", event => {
            if (event.target === imageModal) closeImage();
        });

        document.addEventListener("keydown", event => {
            if (imageModal.classList.contains("hidden")) return;
            if (event.key === "Escape") {
                closeImage();
            } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                moveMedia(-1);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                moveMedia(1);
            }
        });

        logoutButton.addEventListener("click", () => {
            localStorage.removeItem("active");
            localStorage.removeItem("status");
        });

        loadUserStatus();
        loadPhotos();
       
    
        });
</script>
</body>
</html>
