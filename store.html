        function detectYear(fileName) {

        function formatFileSize(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return "Unknown size";
            const units = ["B", "KB", "MB", "GB"];
            const index = Math.min(
                Math.floor(Math.log(bytes) / Math.log(1024)),
                units.length - 1
            );
            return `${(bytes / 1024 ** index).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;

        function safeFileName(name) {

        function createStoragePath(file) {

        async function createThumbnail(blob) {
            if (!("createImageBitmap" in window)) {
                throw new Error("This browser cannot create thumbnails. Try a recent version of Chrome, Edge, or Firefox.");
            }

            const bitmap = await createImageBitmap(blob);
            const width = 480;
            const height = 360;
            const scale = Math.max(width / bitmap.width, height / bitmap.height);
            const cropWidth = width / scale;
            const cropHeight = height / scale;
            const cropX = (bitmap.width - cropWidth) / 2;
            const cropY = (bitmap.height - cropHeight) / 2;
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");
            if (!context) {
                bitmap.close();
                throw new Error("Could not create a thumbnail canvas.");
            }

            context.drawImage(bitmap, cropX, cropY, cropWidth, cropHeight, 0, 0, width, height);
            bitmap.close();

            const thumbnail = await new Promise(resolve =>
                canvas.toBlob(resolve, "image/webp", 0.68)
            );
            if (!thumbnail) throw new Error("Could not encode the thumbnail as WebP.");
            return thumbnail;
        }

        function waitForVideoEvent(video, readyEvent, timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                const cleanup = () => {
                    clearTimeout(timeout);
                    video.removeEventListener(readyEvent, onReady);
                    video.removeEventListener("error", onError);
                };
                const onReady = () => {
                    cleanup();
                    resolve();
                };
                const onError = () => {
                    cleanup();
                    reject(new Error("This video format could not be previewed in this browser."));
                };
                const timeout = setTimeout(() => {
                    cleanup();
                    reject(new Error("Timed out while preparing the video preview."));
                }, timeoutMs);
                video.addEventListener(readyEvent, onReady, { once: true });
                video.addEventListener("error", onError, { once: true });
            });
        }

        async function createVideoThumbnail(file) {
            const objectUrl = URL.createObjectURL(file);
            const video = document.createElement("video");
            video.preload = "metadata";
            video.muted = true;
            video.playsInline = true;

            try {
                const metadataReady = waitForVideoEvent(video, "loadedmetadata");
                video.src = objectUrl;
                video.load();
                await metadataReady;
                if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                    const firstFrameReady = waitForVideoEvent(video, "loadeddata");
                    await firstFrameReady;
                }

                const targetTime = Number.isFinite(video.duration) && video.duration > 0
                    ? Math.min(1, video.duration / 2)
                    : 0;
                if (targetTime > 0) {
                    video.currentTime = targetTime;
                    await waitForVideoEvent(video, "seeked");
                }

                if (!video.videoWidth || !video.videoHeight) {
                    throw new Error("The video has no previewable frame.");
                }

                const width = 480;
                const height = 270;
                const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
                const cropWidth = width / scale;
                const cropHeight = height / scale;
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const context = canvas.getContext("2d");
                if (!context) throw new Error("Could not create a video preview canvas.");

                context.drawImage(
                    video,
                    (video.videoWidth - cropWidth) / 2,
                    (video.videoHeight - cropHeight) / 2,
                    cropWidth,
                    cropHeight,
                    0,
                    0,
                    width,
                    height
                );

                const thumbnail = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.82));
                if (!thumbnail) throw new Error("Could not encode the video preview.");
                return thumbnail;
            } finally {
                video.pause();
                video.removeAttribute("src");
                video.load();
                URL.revokeObjectURL(objectUrl);
            }
        }

        async function sha256File(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function findExistingByHash(fileHash) {

                .maybeSingle();

            if (error) throw new Error(`Duplicate check failed: ${error.message}`);
            return data;
        }

            const controller = new AbortController();

            try {
                const response = await fetch(getPublicUrl(storagePath), {
                    method: "HEAD",
                    cache: "no-store",
                    signal: controller.signal
                });
                return response.ok ? true : response.status >= 500 ? null : false;
            } catch (error) {
                console.warn("Could not verify photo storage object:", storagePath, error);
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        async function validatePhotoCardsAfterRender() {
            const cards = Array.from(container.querySelectorAll(".gallery-item[data-storage-path]"));
            const targets = cards.filter(card => {
                const path = card.dataset.storagePath;
                if (!path || photoAvailabilityCache.has(path) || photoChecksInProgress.has(path)) return false;
                photoChecksInProgress.add(path);
                return true;
            });
            let nextIndex = 0;

            const worker = async () => {
                while (nextIndex < targets.length) {
                    const card = targets[nextIndex++];
                    const path = card.dataset.storagePath;
                    const available = await isStorageObjectAvailable(path);
                    photoChecksInProgress.delete(path);
                    if (available === null) continue;
                    photoAvailabilityCache.set(path, available);
                    if (available) continue;

                    galleryItems = galleryItems.filter(item => item.storage_path !== path);
                    for (const matchingCard of container.querySelectorAll(".gallery-item[data-storage-path]")) {
                        if (matchingCard.dataset.storagePath === path) matchingCard.remove();
                    }
                }
            };

            await Promise.all(Array.from({ length: Math.min(8, targets.length) }, worker));
            if (!container.querySelector(".gallery-item") && galleryItems.length === 0) {
                renderGallery([]);
            }
        }

        async function loadPhotos() {
            container.innerHTML = '<p id="defaults">Loading photos...</p>';

            const { data, error } = await supabaseClient
                .from("photos")
                .select("id, file_name, storage_path, uploaded_by, created_at, file_hash, file_size")
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Could not load photos:", error);
                renderGallery([]);
                showMessage(`Could not load photos: ${error.message}`, "error");
                return;
            }

            galleryItems = (data || []).map(record => ({
                ...record,
                url: getPublicUrl(record.storage_path),
                thumbnailUrl: getThumbnailUrl(record.storage_path),
                year: detectYear(record.file_name)
            }));

            sortGallery(sortSelect.value);
        }

        const imageObserver = "IntersectionObserver" in window
            ? new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    img.src = img.dataset.thumbnailUrl;
                    img.removeAttribute("data-thumbnail-url");
                    observer.unobserve(img);
                });
            }, { rootMargin: "200px 0px" })
            : null;

        function createImageElement(item) {
            const wrapper = document.createElement("div");
            wrapper.className = "gallery-item";
            wrapper.dataset.storagePath = item.storage_path;

            const frame = document.createElement("div");
            frame.className = "image-frame";

            const img = document.createElement("img");
            img.alt = item.file_name || "Drama Team photo";
            img.className = "gallery-image";
            img.loading = "lazy";
            img.decoding = "async";
            img.title = item.file_name || "";
            img.dataset.thumbnailUrl = item.thumbnailUrl || getThumbnailUrl(item.storage_path);
            frame.setAttribute("role", "button");
            frame.setAttribute("tabindex", "0");
            frame.setAttribute("aria-label", `Open ${item.file_name || "photo"} in full size`);
            frame.addEventListener("click", () => openImage(item.url, item.file_name, item.storage_path));
            frame.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openImage(item.url, item.file_name, item.storage_path);
                }
            });

            img.addEventListener("error", () => {
                if (img.dataset.fallbackAttempted !== "true") {
                    img.dataset.fallbackAttempted = "true";
                    img.src = item.url;
                    return;
                }
                galleryItems = galleryItems.filter(photo => photo.storage_path !== item.storage_path);
                wrapper.remove();
                if (!container.querySelector(".gallery-item") && galleryItems.length === 0) renderGallery([]);
            });

            const info = document.createElement("div");
            info.className = "file-info";

            const name = document.createElement("div");
            name.textContent = item.file_name || "Unnamed image";

            const meta = document.createElement("div");
            meta.className = "file-meta";
            meta.textContent = item.file_size
                ? formatFileSize(Number(item.file_size))
                : "";

            info.append(name, meta);
            frame.appendChild(img);
            if (imageObserver) imageObserver.observe(img);
            else img.src = img.dataset.thumbnailUrl;
            wrapper.append(frame, info);

            return wrapper;
        }

        function renderGallery(items) {
            if (imageObserver) imageObserver.disconnect();
            container.replaceChildren();

            if (items.length === 0) {
                const empty = document.createElement("p");
                empty.id = "defaults";
                empty.textContent = galleryItems.length ? "Nothing to show..." : "No available photos.";
                container.appendChild(empty);
                return;
            }

            items.forEach(item => container.appendChild(createImageElement(item)));
            applyView(viewSelect.value);
            window.setTimeout(validatePhotoCardsAfterRender, 0);
        }

        function sortGallery(sortType) {
            const sorted = [...galleryItems];

            if (sortType === "new") {
                sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (sortType === "older") {
                sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            } else if (sortType === "size") {
                sorted.sort((a, b) => Number(b.file_size || 0) - Number(a.file_size || 0));
            }

            renderGallery(sorted);
        }

        async function loadVideos() {
            videoContainer.innerHTML = '<p class="gallery-empty">Loading videos...</p>';

            const { data, error } = await supabaseClient
                .from("videos")
                .select("id, title, file_key, thumbnail_path, created_at")
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Could not load videos:", error);
                renderVideos([]);
                const empty = videoContainer.querySelector(".gallery-empty");
                if (empty) empty.textContent = "The video gallery is not ready yet. Apply the videos database setup, then reload this page.";
                return;
            }

            const records = data || [];
            videoItems = records;
            renderVideos(videoItems);
        }

        async function getPlayableVideoUrl(fileKey) {
            const response = await fetch(`${SUPABASE_URL}/functions/v1/get-upload-url`, {
                method: "POST",
                headers: {
                    apikey: SUPABASE_PUBLISHABLE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ action: "watch", fileKey })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || `Could not prepare playback (${response.status}).`);
            return result.watchUrl;
        }

        async function checkSignedVideoUrl(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch(url, {
                    method: "GET",
                    headers: { Range: "bytes=0-0" },
                    cache: "no-store",
                    signal: controller.signal
                });
                try { await response.body?.cancel(); } catch { /* stop after response headers */ }
                return response.ok;
            } catch {
                return null;
            } finally {
                clearTimeout(timeout);
            }
        }

        function hideVideoCard(item, wrapper) {
            wrapper.remove();
            videoItems = videoItems.filter(video => video.id !== item.id);
        }

        async function validateVideoCardsAfterRender(cards) {
            let nextIndex = 0;
            const worker = async () => {
                while (nextIndex < cards.length) {
                    const { item, wrapper, player } = cards[nextIndex++];
                    if (!wrapper.isConnected) continue;
                    try {
                        const url = await getPlayableVideoUrl(item.file_key);
                        const available = await checkSignedVideoUrl(url);
                        if (!wrapper.isConnected) continue;
                        if (available === false) {
                            hideVideoCard(item, wrapper);
                            continue;
                        }
                        player.src = url;
                    } catch (error) {
                        console.warn(`Hiding unavailable video ${item.title || item.file_key}:`, error);
                        hideVideoCard(item, wrapper);
                    }
                }
            };

            await Promise.all(Array.from({ length: Math.min(3, cards.length) }, worker));
            if (!videoItems.length) {
                const empty = document.createElement("p");
                empty.className = "gallery-empty";
                empty.textContent = "No available videos. Missing files have been hidden.";
                videoContainer.replaceChildren(empty);
            }
        }

        function renderVideos(items) {
            videoContainer.replaceChildren();

            if (!items.length) {
                const empty = document.createElement("p");
                empty.className = "gallery-empty";
                empty.textContent = "No videos yet. Upload a video to add it here.";
                videoContainer.appendChild(empty);
                return;
            }

            const cardsToValidate = [];
            items.forEach(item => {
                const wrapper = document.createElement("div");
                wrapper.className = "gallery-item video-item";
                wrapper.dataset.videoId = item.id;

                const frame = document.createElement("div");
                frame.className = "video-frame";

                const player = document.createElement("video");
                player.controls = true;
                player.playsInline = true;
                player.title = item.title || "Drama Team video";
                player.preload = "none";
                if (item.thumbnail_path) player.poster = getPublicUrl(item.thumbnail_path);
                player.addEventListener("error", () => {
                    hideVideoCard(item, wrapper);
                    if (!videoItems.length) {
                        const empty = document.createElement("p");
                        empty.className = "gallery-empty";
                        empty.textContent = "No available videos. Missing or unsupported files have been hidden.";
                        videoContainer.replaceChildren(empty);
                    }
                }, { once: true });

                const info = document.createElement("div");
                info.className = "file-info";
                const name = document.createElement("div");
                name.textContent = item.title || "Untitled video";
                const meta = document.createElement("div");
                meta.className = "file-meta";
                meta.textContent = new Date(item.created_at).toLocaleDateString();

                frame.appendChild(player);
                info.append(name, meta);
                wrapper.append(frame, info);
                videoContainer.appendChild(wrapper);
                cardsToValidate.push({ item, wrapper, player });
            });

            window.setTimeout(() => validateVideoCardsAfterRender(cardsToValidate), 0);
        }

        function requestVideoUploadUrl(file, title) {
            return fetch(`${SUPABASE_URL}/functions/v1/get-upload-url`, {
                method: "POST",
                headers: {
                    apikey: SUPABASE_PUBLISHABLE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    action: "upload",
                    fileName: file.name,
                    fileType: file.type,
                    fileSize: file.size,
                    title
                })
            }).then(async response => {
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.error || `Could not prepare the upload (${response.status}).`);
                }
                return result;
            });
        }

        function putVideoFile(url, file, onProgress) {
            return new Promise((resolve, reject) => {
                const request = new XMLHttpRequest();
                request.open("PUT", url);
                request.setRequestHeader("Content-Type", file.type);
                request.upload.addEventListener("progress", event => {
                    if (event.lengthComputable) onProgress(event.loaded, event.total);
                });
                request.addEventListener("load", () => {
                    if (request.status >= 200 && request.status < 300) resolve();
                    else reject(new Error(`B2 upload failed (${request.status}). Check the bucket CORS rule and try again.`));
                });
                request.addEventListener("error", () => reject(new Error("Video upload failed. Check your connection and the B2 bucket CORS settings.")));
                request.addEventListener("abort", () => reject(new Error("Video upload was cancelled.")));
                request.send(file);
            });
        }

        async function createVideoFingerprint(file, onProgress) {
            const chunkSize = 16 * 1024 * 1024;
            const chunkCount = Math.ceil(file.size / chunkSize);
            const chunkDigests = [];

            for (let offset = 0; offset < file.size; offset += chunkSize) {
                const chunk = await file.slice(offset, Math.min(offset + chunkSize, file.size)).arrayBuffer();
                chunkDigests.push(new Uint8Array(await crypto.subtle.digest("SHA-256", chunk)));
                onProgress(chunkDigests.length, chunkCount);
            }

            const prefix = new TextEncoder().encode(`DTM_VIDEO_FINGERPRINT_V1:${file.size}:`);
            const fingerprintBytes = new Uint8Array(prefix.length + chunkDigests.length * 32);
            fingerprintBytes.set(prefix);
            chunkDigests.forEach((digest, index) => fingerprintBytes.set(digest, prefix.length + index * 32));

            const fingerprint = await crypto.subtle.digest("SHA-256", fingerprintBytes);
            return Array.from(new Uint8Array(fingerprint))
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function findExistingVideoByHash(fileHash) {
            const { data, error } = await supabaseClient
                .from("videos")
                .select("id, title")
                .eq("file_hash", fileHash)
                .maybeSingle();

            if (error) throw new Error(`Video duplicate check failed: ${error.message}`);
            return data;
        }

        async function uploadVideo(file, title, index, total) {
            if (!file.type.startsWith("video/")) {
                throw new Error(`${file.name} is not a recognized video file.`);
            }
            if (file.size > MAX_VIDEO_FILE_SIZE) {
                throw new Error(`${file.name} is larger than 5 GB.`);
            }

            videoProgress.value = 0;
            videoUploadStatus.hidden = false;
            videoProgressText.textContent = `Checking for duplicate ${index}/${total}: ${file.name}`;

            const fileHash = await createVideoFingerprint(file, (completed, chunks) => {
                videoProgress.value = Math.round((completed / chunks) * 100);
                videoProgressText.textContent = `Checking ${index}/${total}: ${file.name} (${videoProgress.value}%)`;
            });
            if (await findExistingVideoByHash(fileHash)) {
                return { duplicate: true };
            }

            videoProgress.value = 0;
            videoProgressText.textContent = `Creating preview ${index}/${total}: ${file.name}`;
            let thumbnailPath = null;
            try {
                const thumbnail = await createVideoThumbnail(file);
                const candidatePath = `video-thumbnails/${crypto.randomUUID()}.jpg`;
                const { error: thumbnailError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(candidatePath, thumbnail, {
                        cacheControl: "31536000",
                        contentType: "image/jpeg",
                        upsert: false
                    });
                if (thumbnailError) throw thumbnailError;
                thumbnailPath = candidatePath;
            } catch (error) {
                console.warn(`Could not save a preview for ${file.name}:`, error);
            }

            try {
                const upload = await requestVideoUploadUrl(file, title);
                await putVideoFile(upload.uploadUrl, file, (loaded, size) => {
                    videoProgress.value = Math.round((loaded / size) * 100);
                    videoProgressText.textContent = `Uploading ${index}/${total}: ${file.name} (${videoProgress.value}%)`;
                });

                const { error } = await supabaseClient.from("videos").insert({
                    title: upload.title,
                    file_key: upload.fileKey,
                    file_hash: fileHash,
                    thumbnail_path: thumbnailPath
                });
                if (error) throw new Error(`Video uploaded, but could not save its gallery record: ${error.message}`);
            } catch (error) {
                if (thumbnailPath) {
                    await supabaseClient.storage.from(BUCKET_NAME).remove([thumbnailPath]).catch(() => {});
                }
                throw error;
            }

            return { duplicate: false, hasPreview: Boolean(thumbnailPath) };
        }

        videoInput.addEventListener("change", async event => {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            document.body.style.cursor = "progress";
            videoInput.disabled = true;
            videoUploadLabel.classList.add("disabled");
            videoUploadLabel.textContent = "Uploading...";
            videoUploadLabel.setAttribute("aria-disabled", "true");

            const failed = [];
            let uploaded = 0;
            let duplicates = 0;
            let previewsMissing = 0;
            const selectedTitle = videoTitleInput.value.trim();
            for (let index = 0; index < files.length; index++) {
                try {
                    const title = files.length === 1 && selectedTitle
                        ? selectedTitle
                        : files[index].name.replace(/\.[^.]+$/, "");
                    const outcome = await uploadVideo(files[index], title, index + 1, files.length);
                    if (outcome.duplicate) {
                        duplicates++;
                        continue;
                    }
                    uploaded++;
                    if (!outcome.hasPreview) previewsMissing++;
                } catch (error) {
                    console.error(error);
                    failed.push(`${files[index].name}: ${error.message}`);
                }
            }

            await loadVideos();
            document.body.style.cursor = "";
            videoInput.disabled = false;
            videoUploadLabel.classList.remove("disabled");
            videoUploadLabel.removeAttribute("aria-disabled");
            videoUploadLabel.textContent = "Upload videos";
            videoInput.value = "";
            videoTitleInput.value = "";
            videoUploadStatus.hidden = true;

            if (failed.length) {
                showMessage(`${uploaded} uploaded; ${duplicates} duplicate${duplicates === 1 ? "" : "s"} skipped; ${failed.length} failed. ${failed.join(" | ")}`, "error");
            } else {
                const duplicateNote = duplicates
                    ? ` ${duplicates} duplicate${duplicates === 1 ? " was" : "s were"} skipped.`
                    : "";
                const previewNote = previewsMissing
                    ? ` ${previewsMissing} preview${previewsMissing === 1 ? " was" : "s were"} unavailable.`
                    : "";
                const uploadNote = uploaded
                    ? `${uploaded} video${uploaded === 1 ? "" : "s"} uploaded.`
                    : "No new videos uploaded.";
                showMessage(`${uploadNote}${duplicateNote}${previewNote}`, "success");
            }
        });

        function applyView(viewType) {
            container.classList.remove("large-view", "title-view");
            if (viewType === "large") container.classList.add("large-view");
            if (viewType === "title") container.classList.add("title-view");
        }

        viewSelect.addEventListener("change", event => applyView(event.target.value));
        sortSelect.addEventListener("change", event => sortGallery(event.target.value));

        async function uploadFile(file) {
            if (!file.type.startsWith("image/")) {
                throw new Error(`${file.name} is not an image.`);
            }

            if (file.size > MAX_FILE_SIZE) {
                throw new Error(`${file.name} is larger than ${formatFileSize(MAX_FILE_SIZE)}.`);
            }

            // Hash the actual bytes. The filename does NOT matter.
            const fileHash = await sha256File(file);

            // First check prevents an unnecessary storage upload in normal cases.
            const existing = await findExistingByHash(fileHash);

            if (existing) {
                return {
                    duplicate: true,
                    existing: {
                        ...existing,
                        url: getPublicUrl(existing.storage_path),
                        thumbnailUrl: getThumbnailUrl(existing.storage_path),
                        year: detectYear(existing.file_name)
                    }
                };
            }

            const thumbnail = await createThumbnail(file);

            const storagePath = createStoragePath(file);

            const { error: storageError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(storagePath, file, {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                });

            if (storageError) {
                throw new Error(`Storage upload failed for ${file.name}: ${storageError.message}`);
            }

            const thumbnailPath = getThumbnailPath(storagePath);
            const { error: thumbnailError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(thumbnailPath, thumbnail, {
                    cacheControl: "31536000",
                    upsert: false,
                    contentType: "image/webp"
                });

            if (thumbnailError) {
                await supabaseClient.storage.from(BUCKET_NAME).remove([storagePath]);
                throw new Error(`Thumbnail upload failed for ${file.name}: ${thumbnailError.message}`);
            }

            // The UNIQUE(file_hash) constraint is the final protection against
            // two people uploading the same file simultaneously.
            const { data: record, error: databaseError } = await supabaseClient
                .from("photos")
                .insert({
                    file_name: file.name,
                    storage_path: storagePath,
                    uploaded_by: "anonymous",
                    file_hash: fileHash,
                    file_size: file.size
                })
                .select()
                .single();

            if (databaseError) {
                // If another upload won the race, our storage object is unnecessary.
                await supabaseClient.storage.from(BUCKET_NAME).remove([storagePath, thumbnailPath]);

                if (databaseError.code === "23505") {
                    const winner = await findExistingByHash(fileHash);
                    if (winner) {
                        return {
                            duplicate: true,
                            existing: {
                                ...winner,
                                url: getPublicUrl(winner.storage_path),
                                thumbnailUrl: getThumbnailUrl(winner.storage_path),
                                year: detectYear(winner.file_name)
                            }
                        };
                    }
                }

                throw new Error(`Database save failed for ${file.name}: ${databaseError.message}`);
            }

            return {
                duplicate: false,
                ...record,
                url: getPublicUrl(storagePath),
                thumbnailUrl: getThumbnailUrl(storagePath),
                year: detectYear(file.name)
            };
        }

        input.addEventListener("change", async event => {
            const selectedFiles = Array.from(event.target.files);
            if (!selectedFiles.length) return;

            document.body.style.cursor = "progress";
            uploadLabel.classList.add("disabled");
            uploadLabel.textContent = "Checking...";

            let uploaded = 0;
            let duplicates = 0;
            const failed = [];

            for (const file of selectedFiles) {
                try {
                    const result = await uploadFile(file);

                    if (result.duplicate) {
                        duplicates++;
                    } else {
                        galleryItems.unshift(result);
                        uploaded++;
                    }
                } catch (error) {
                    console.error(error);
                    failed.push(error.message);
                }
            }

            sortGallery(sortSelect.value);

            const parts = [];
            if (uploaded) parts.push(`${uploaded} uploaded`);
            if (duplicates) parts.push(`${duplicates} duplicate${duplicates === 1 ? "" : "s"} skipped`);

            if (failed.length) {
                parts.push(`${failed.length} failed`);
                showMessage(`${parts.join(" â€¢ ")}: ${failed.join(" | ")}`, "error");
            } else {
                showMessage(
                    parts.length ? parts.join(" â€¢ ") : "Nothing uploaded.",
                    duplicates && !uploaded ? "success" : "success"
                );
            }

            document.body.style.cursor = "";
            uploadLabel.classList.remove("disabled");
            uploadLabel.textContent = "Upload";
            input.value = "";
        });

        function openImage(url, fileName, storagePath) {
            zoomedImage.src = url;
            zoomedImage.alt = fileName || "Selected image";
            currentStoragePath = storagePath;
            currentFileName = fileName || "image";
            imageModal.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        downloadImageButton.addEventListener("click", async () => {
            if (!currentStoragePath) return;
            const storagePath = currentStoragePath;
            const fileName = currentFileName;

            downloadImageButton.disabled = true;
            downloadImageButton.textContent = "Downloading...";

            try {
                const { data, error } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .download(storagePath);

                if (error) throw error;

                const downloadUrl = URL.createObjectURL(data);
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
            } catch (error) {
                console.error("Could not download image:", error);
                showMessage("Could not download this image. Please try again.", "error");
            } finally {
                downloadImageButton.disabled = false;
                downloadImageButton.textContent = "Download";
            }
        });

        zoomedImage.addEventListener("error", () => {
            showMessage("Could not load the original image.", "error");
        });

        function closeImage() {
            imageModal.classList.add("hidden");
            zoomedImage.removeAttribute("src");
            document.body.style.overflow = "";
        }

        closeButton.addEventListener("click", closeImage);

        imageModal.addEventListener("click", event => {
            if (event.target === imageModal) closeImage();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !imageModal.classList.contains("hidden")) {
                closeImage();
            }
        });

        logoutButton.addEventListener("click", () => {
            localStorage.removeItem("active");
            localStorage.removeItem("status");
        });

        loadUserStatus();
        loadPhotos();
       
    </script>
