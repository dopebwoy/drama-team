<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama gallery stock</title>
    <link rel="icon" type="image/icon" href="./photos/logo.png">
    <style>
        body {
            background-color: rgb(17, 17, 17);
            color: bisque;
            font-size: 20px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: lighter;
        }

        nav {
            display: flex;
            justify-content: space-between;
        }

        a {
            margin: 0 45px;
        }

        section {
            display: flex;

        }

        select {
            border-radius: 10px;
        }

        #umukomite-button {
            padding: 5px;
            background-color: rgb(207, 208, 209);
        }

        #logout-button {
            padding: 5px;
            background-color: brown;
        }

        #logo-tittle {
            position: relative;
            top: 1cm;


        }

        #small-tittle {
            position: relative;
            top: 2px;
            font-size: 10px;
        }

        #defaults {
            font-size: 9px;
            color: rgb(225, 248, 248);
            text-align: center;
            margin-top: 4cm;
        }

        fieldset {
            min-height: 400px;
            display: flex;
            flex-wrap: wrap;
            margin: 0 1px;
            justify-content: center;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 20px 3px;
            border-radius: 5px;
            border: 1px rgb(41, 41, 41) solid;
            background-color: rgb(26, 26, 26);
        }

        .smallImage {
            border-radius: 10px;
            width: 100px;
            height: 120px;
            padding: 2px;
        }

        .new::after {
            content: ',  here u can check on all photos u want from drama team family';
        }

        #tools {
            display: flex;
            font-size: 13px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            justify-content: space-evenly;
        }

        .input {
            background-color: rgb(211, 211, 211);
            color: black;
            font-weight: 100%;
            border-radius: 8px;
            padding: 1px 7px;

        }

        #logo {
            min-width: 90px;
            min-height: 50px;
            max-height: 100px;
        }

        select {
            background-color: rgb(207, 207, 207);
        }

        #close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 45px;
            color: white;
            cursor: pointer;
        }

        #zoomedImage {
          min-width: 100%;
          max-height: 100%;
            border: 1 solid indianred;
            position: relative;
            border-radius: 20px;
            
            
           
        }
        #zoomedImage :focus{
            box-shadow: 5px 5px 8px 2px rgba(0, 255, 0, 0.2);
        }
        .model {
            display: flex;
            position: sticky;
            bottom: 1cm;
            object-fit: contain;
            max-height: 100%;
        }

        .visibility {
            display: none;
            
        } main{
           position: relative;
           
        }
    </style>
</head>

<body>
    <nav>
        <a href="manager.html"><button id="umukomite-button">umucomitte</button></a>
        <a href="index.html"><button id="logout-button">LogOut</button></a>
    </nav>
    <header>
        <section>
            <img src="./photos/logo.png" alt="logo" width="100px" height="100px" id="logo">
            <p id="logo-tittle">DRAMA TEAM <small id="small-tittle"><strong>Guardian of heaven</strong></small></p>
        </section>

        <h2><span id="great">welcome back</span> <span id="tittle">...</span></h2>


    </header>
    <main>
        <div id="tools">
            <div><input type="file" id="input" multiple accept="image/*" hidden>
                <label for="input" class="input"><strong>upload</strong></label>
            </div>
            <div> <label for="sort">sort</label>
                <select id="sort">
                    <option>time created</option>
                    <option>year</option>
                    <option>oldest</option>
                </select>
            </div>
            <div> <label for="view">view</label>
                <select id="view">
                    <option>gird</option>
                    <option>large</option>
                    <option>titlle</option>
                </select>
            </div>



        </div>

        <fieldset id="container">
            <p id="defaults">nothing to show...</p>



        </fieldset>
        <div class="model">
            <img id="zoomedImage">
        </div>

    </main>
    <script>

        const status = JSON.parse(localStorage.getItem('status'))
        storedNmae = status[2]
        document.getElementById('tittle').textContent = storedNmae
        const viewer = document.getElementById('viewer')
        const zoomedImage = document.getElementById('zoomedImage')
        const logout = document.getElementById('logout-button')

        logout.addEventListener('click', () => {
            localStorage.clear()

        })

        const newcheck = status[0]
        if (newcheck === 'new') {
            let great = document.getElementById("great")
            let title = document.getElementById('tittle')
            great.textContent = 'hey ☺️ '
            great.style.fontSize = "15px"
            title.classList.add('new')
            title.style.fontSize = '15px'

        }
        let container = document.getElementById('container')
        let input = document.querySelector("input")
        let model = document.querySelector('.model')

        let largeImage = document.getElementById('zoomedImage')
        input.addEventListener('change', () => {
            container.innerHTML = ''

            for (file of input.files) {
                let imageURL = URL.createObjectURL(file)
                let img = document.createElement('img')
                img.src = imageURL
                container.appendChild(img)
                img.classList.add('smallImage')
                document.querySelectorAll('.smallImage').forEach((element) => {
                    element.addEventListener('click', (e) => {
                        model.classList.toggle('visibility')
                        largeImage.src = e.target.src

                    });
                })

            }
        }
        )
        largeImage.addEventListener('click',(e)=>{
           model.classList.add('visibility')
        })







    </script>
</body>

</html>
