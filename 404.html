<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found | Drama Team Family</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --panel: #161b22; --gold: #e6c989; --text: #f3efe7; --muted: #b9c2ca; --line: #303943; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 22px; background: radial-gradient(circle at top, #1d302d, var(--bg) 42rem); color: var(--text); font: 16px/1.6 Georgia, 'Times New Roman', serif; }
    main { width: min(620px, 100%); padding: clamp(24px, 6vw, 48px); border: 1px solid var(--line); border-radius: 20px; background: rgba(22, 27, 34, .94); box-shadow: 0 22px 60px #0008; text-align: center; }
    .eyebrow { color: var(--gold); font: 700 .8rem/1.4 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0; color: var(--gold); font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.1; }
    p { color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid #9a7630; border-radius: 999px; background: #252d34; color: var(--gold); font: 700 .95rem system-ui, sans-serif; text-decoration: none; }
    a:first-child { background: var(--gold); color: #17130d; }
    a:hover, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Drama Team Family</span>
    <h1>Page not found</h1>

      <a href="/about.html">About</a>
      <a href="/contributions.html">Family Contributions</a>
      <a href="/contact.html">Contact Umukomite</a>
    </nav>
  </main>
</body>
</html>
