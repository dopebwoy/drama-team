<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Gallery Stock</title>
    <link rel="icon" type="image/png" href="./photos/logo.png">

    <style>
        :root {
            --bg: #111;
            --surface: #1a1a1a;
            --surface-2: #242424;
            --text: bisque;
            --muted: #bdbdbd;
            --border: #333;
            --accent: #d3d3d3;
            --danger: #8b0000;
            --success: #216e39;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", Times, serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
        }

        nav a { margin: 0; text-decoration: none; }

        button, select, label { font: inherit; }

        .nav-button {
            border: 0;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: opacity .2s ease, transform .2s ease;
        }

        .nav-button:hover {
            opacity: .85;
            transform: translateY(-1px);
        }

        #umukomite-button {
            background: var(--accent);
            color: #111;
        }

        #logout-button {
            background: brown;
            color: white;
        }

        header { padding: 10px 20px 20px; }

        header section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logo {
            width: 90px;
            height: 90px;
            max-width: 100%;
            object-fit: contain;
        }

        #logo-title {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
        }

        #small-title {
            display: block;
            margin-top: 3px;
            font-size: .65rem;
        }

        #welcome {
            margin: 15px 0 0;
            font-size: clamp(1.2rem, 3vw, 1.7rem);
        }

        #title.new::after {
            content: ", here you can check all photos you want from drama team family";
        }

        #title.new, #welcome.new { font-size: 15px; }

        main {
            position: relative;
            padding: 0 12px 30px;
        }

        #tools {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin-bottom: 15px;
            font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
                sans-serif;
        }

        .tool {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-button {
            display: inline-block;
            background: #d3d3d3;
            color: #111;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .input-button.disabled {
            cursor: wait;
            opacity: .55;
        }

        select {
            background: #cfcfcf;
            color: #111;
            border: 0;
            border-radius: 8px;
            padding: 5px 8px;
            cursor: pointer;
        }

        #container {
            min-height: 400px;
            margin: 0;
            padding: 20px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            align-content: start;
        }

        #container.large-view {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        #container.title-view {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .gallery-item {
            min-width: 0;
            overflow: hidden;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid #2e2e2e;
            transition: transform .2s ease, border-color .2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-2px);
            border-color: #666;
        }

        .image-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #0c0c0c;
        }

        .gallery-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform .25s ease;
        }

        .gallery-item:hover .gallery-image { transform: scale(1.025); }

        .file-info {
            padding: 2px 10px 10px;
            color: var(--muted);
            font: 0px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .file-meta {
            margin-top: 3px;
            color: #888;
            font-size: 10px;
        }

        #container.title-view .gallery-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
        }

        #container.title-view .image-frame {
            flex: 0 0 90px;
            width: 90px;
            aspect-ratio: 4 / 3;
            border-radius: 7px;
        }

        #container.title-view .file-info {
            padding: 0;
        }

        #defaults {
            grid-column: 1 / -1;
            margin: auto;
            color: #e1f8f8;
            font-size: 14px;
            text-align: center;
        }

        .broken-image {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            color: #888;
            font: 12px system-ui, sans-serif;
            text-align: center;
            padding: 10px;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(0, 0, 0, .92);
        }

        .modal.hidden { display: none; }

        #zoomedImage {
            display: block;
            max-width: 95vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 1px solid indianred;
            border-radius: 20px;
        }

        #close {
            position: absolute;
            top: 15px;
            right: 25px;
            border: 0;
            background: transparent;
            color: white;
            font-size: 45px;
            line-height: 1;
            cursor: pointer;
        }

        #close:hover { color: #ddd; }

        @media (max-width: 600px) {
            nav { padding: 10px; }
            header { padding-inline: 10px; }
            #logo { width: 70px; height: 70px; }
            #container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 8px; }
            #container.large-view { grid-template-columns: 1fr; }
            .modal { padding: 15px; }
            #close { top: 10px; right: 15px; font-size: 38px; }
            .file-info { font-size: 11px; }
        }
    </style>
</head>

<body>
    <nav>
        <a href="login.html">
            <button type="button" class="nav-button" id="umukomite-button">Umukomitte</button>
        </a>
        <a href="index.html">
            <button type="button" class="nav-button" id="logout-button">Log Out</button>
        </a>
    </nav>

    <header>
        <section>
            <img src="./photos/logo.png" alt="Drama Team logo" id="logo">
            <p id="logo-title">
                DRAMA TEAM
                <small id="small-title"><strong>Guardian of heaven</strong></small>
            </p>
        </section>

        <h2 id="welcome">
            <span id="great">Welcome back</span>
            <span id="title">...</span>
        </h2>
    </header>

    <main>
        <div id="tools">
            <div class="tool">
                <input type="file" id="input" multiple accept="image/*" hidden>
                <label for="input" class="input-button" id="uploadLabel">Upload</label>
            </div>

            <div class="tool">
                <label for="sort">Sort</label>
                <select id="sort">
                    <option value="new">New</option>
                    <option value="older">Older</option>
                    <option value="size">Size</option>
                </select>
            </div>

            <div class="tool">
                <label for="view">View</label>
                <select id="view">
                    <option value="grid">Grid</option>
                    <option value="large">Large</option>
                    <option value="title">Small</option>
                </select>
            </div>
        </div>

        <div id="container" aria-live="polite">
            <p id="defaults">Nothing to show...</p>
        </div>
    </main>

    <div id="imageModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <button type="button" id="close" aria-label="Close image preview">&times;</button>
        <img id="zoomedImage" alt="Selected image preview">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        "use strict";

        const SUPABASE_URL = "https://fedwjrefdabcbbklaafz.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wL7XncIhcH0fqjL_Mxo4Lg_U5z_2edi";
        const BUCKET_NAME = "photos";
        const MAX_FILE_SIZE = 10 * 1024 * 1024;

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const input = document.getElementById("input");
        const uploadLabel = document.getElementById("uploadLabel");
        const container = document.getElementById("container");
        const sortSelect = document.getElementById("sort");
        const viewSelect = document.getElementById("view");
        const imageModal = document.getElementById("imageModal");
        const zoomedImage = document.getElementById("zoomedImage");
        const closeButton = document.getElementById("close");
        const logoutButton = document.getElementById("logout-button");
        const great = document.getElementById("great");
        const title = document.getElementById("title");

        let galleryItems = [];

        function showMessage(message, type = "") {
            let box = document.getElementById("statusMessage");
            if (!box) {
                box = document.createElement("p");
                box.id = "statusMessage";
                box.style.cssText =
                    "position:fixed;left:50%;top:15px;transform:translateX(-50%);z-index:1100;max-width:90vw;padding:10px 15px;border-radius:8px;font:13px system-ui,sans-serif;background:#222;color:#fff;text-align:center;";
                document.body.appendChild(box);
            }
            box.textContent = message;
            box.style.background =
                type === "error" ? "#6b1d1d" :
                type === "success" ? "#216e39" : "#222";
            clearTimeout(showMessage.timer);
            showMessage.timer = setTimeout(() => box.remove(), 5000);
        }

        function loadUserStatus() {
            try {
                const savedStatus = localStorage.getItem("status");
                if (!savedStatus) {
                    title.textContent = "";
                    return;
                }
                const status = JSON.parse(savedStatus);
                if (Array.isArray(status)) {
                    title.textContent = status[2] ?? "";
                    if (status[0] === "new") {
                        great.textContent = "Hey ☺️";
                        title.classList.add("new");
                    }
                }
            } catch (error) {
                console.error("Could not read saved status:", error);
                title.textContent = "";
            }
        }

        function detectYear(fileName) {
            const match = fileName.match(/\b(2024|2025|2026)\b/);
            return match ? Number(match[1]) : null;
        }

        function formatFileSize(bytes) {
            if (!Number.isFinite(bytes) || bytes <= 0) return "Unknown size";
            const units = ["B", "KB", "MB", "GB"];
            const index = Math.min(
                Math.floor(Math.log(bytes) / Math.log(1024)),
                units.length - 1
            );
            return `${(bytes / 1024 ** index).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
        }

        function safeFileName(name) {
            return name
                .normalize("NFKD")
                .replace(/[^\w.\-]+/g, "-")
                .replace(/-+/g, "-")
                .replace(/^-|-$/g, "")
                .toLowerCase() || "image";
        }

        function createStoragePath(file) {
            return `${crypto.randomUUID()}-${safeFileName(file.name)}`;
        }

        function getPublicUrl(storagePath) {
            const { data } = supabaseClient.storage
                .from(BUCKET_NAME)
                .getPublicUrl(storagePath);
            return data.publicUrl;
        }

        async function sha256File(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function findExistingByHash(fileHash) {
            const { data, error } = await supabaseClient
                .from("photos")
                .select("id, file_name, storage_path, uploaded_by, created_at, file_hash")
                .eq("file_hash", fileHash)
                .maybeSingle();

            if (error) throw new Error(`Duplicate check failed: ${error.message}`);
            return data;
        }

        async function loadPhotos() {
            container.innerHTML = '<p id="defaults">Loading photos...</p>';

            const { data, error } = await supabaseClient
                .from("photos")
                .select("id, file_name, storage_path, uploaded_by, created_at, file_hash, file_size")
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Could not load photos:", error);
                renderGallery([]);
                showMessage(`Could not load photos: ${error.message}`, "error");
                return;
            }

            galleryItems = data.map(record => ({
                ...record,
                url: getPublicUrl(record.storage_path),
                year: detectYear(record.file_name)
            }));

            sortGallery(sortSelect.value);
        }

        function createImageElement(item) {
            const wrapper = document.createElement("div");
            wrapper.className = "gallery-item";

            const frame = document.createElement("div");
            frame.className = "image-frame";

            const img = document.createElement("img");
            img.src = item.url;
            img.alt = item.file_name || "Drama Team photo";
            img.className = "gallery-image";
            img.loading = "lazy";
            img.decoding = "async";
            img.title = item.file_name || "";
            img.addEventListener("click", () => openImage(item.url, item.file_name));

            img.addEventListener("error", () => {
                // A missing Storage object should not remain visible as a dead card.
                // The manager's cleanup tool can remove the orphaned database row.
                const currentId = item.id;
                galleryItems = galleryItems.filter(record => String(record.id) !== String(currentId));
                wrapper.remove();
                if (!galleryItems.length) {
                    renderGallery([]);
                }
            }, { once: true });

            const info = document.createElement("div");
            info.className = "file-info";

            const name = document.createElement("div");
            name.textContent = item.file_name || "Unnamed image";

            const meta = document.createElement("div");
            meta.className = "file-meta";
            meta.textContent = item.file_size
                ? formatFileSize(Number(item.file_size))
                : "";

            info.append(name, meta);
            frame.appendChild(img);
            wrapper.append(frame, info);

            return wrapper;
        }

        function renderGallery(items) {
            container.replaceChildren();

            if (items.length === 0) {
                const empty = document.createElement("p");
                empty.id = "defaults";
                empty.textContent = "Nothing to show...";
                container.appendChild(empty);
                return;
            }

            items.forEach(item => container.appendChild(createImageElement(item)));
            applyView(viewSelect.value);
        }

        function sortGallery(sortType) {
            const sorted = [...galleryItems];

            if (sortType === "new") {
                sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (sortType === "older") {
                sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            } else if (sortType === "size") {
                sorted.sort((a, b) => Number(b.file_size || 0) - Number(a.file_size || 0));
            }

            renderGallery(sorted);
        }

        function applyView(viewType) {
            container.classList.remove("large-view", "title-view");
            if (viewType === "large") container.classList.add("large-view");
            if (viewType === "title") container.classList.add("title-view");
        }

        viewSelect.addEventListener("change", event => applyView(event.target.value));
        sortSelect.addEventListener("change", event => sortGallery(event.target.value));

        async function uploadFile(file) {
            if (!file.type.startsWith("image/")) {
                throw new Error(`${file.name} is not an image.`);
            }

            if (file.size > MAX_FILE_SIZE) {
                throw new Error(`${file.name} is larger than ${formatFileSize(MAX_FILE_SIZE)}.`);
            }

            // Hash the actual bytes. The filename does NOT matter.
            const fileHash = await sha256File(file);

            // First check prevents an unnecessary storage upload in normal cases.
            const existing = await findExistingByHash(fileHash);

            if (existing) {
                return {
                    duplicate: true,
                    existing: {
                        ...existing,
                        url: getPublicUrl(existing.storage_path),
                        year: detectYear(existing.file_name)
                    }
                };
            }

            const storagePath = createStoragePath(file);

            const { error: storageError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(storagePath, file, {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                });

            if (storageError) {
                throw new Error(`Storage upload failed for ${file.name}: ${storageError.message}`);
            }

            // The UNIQUE(file_hash) constraint is the final protection against
            // two people uploading the same file simultaneously.
            const { data: record, error: databaseError } = await supabaseClient
                .from("photos")
                .insert({
                    file_name: file.name,
                    storage_path: storagePath,
                    uploaded_by: "anonymous",
                    file_hash: fileHash,
                    file_size: file.size
                })
                .select()
                .single();

            if (databaseError) {
                // If another upload won the race, our storage object is unnecessary.
                await supabaseClient.storage.from(BUCKET_NAME).remove([storagePath]);

                if (databaseError.code === "23505") {
                    const winner = await findExistingByHash(fileHash);
                    if (winner) {
                        return {
                            duplicate: true,
                            existing: {
                                ...winner,
                                url: getPublicUrl(winner.storage_path),
                                year: detectYear(winner.file_name)
                            }
                        };
                    }
                }

                throw new Error(`Database save failed for ${file.name}: ${databaseError.message}`);
            }

            return {
                duplicate: false,
                ...record,
                url: getPublicUrl(storagePath),
                year: detectYear(file.name)
            };
        }

        input.addEventListener("change", async event => {
            const selectedFiles = Array.from(event.target.files);
            if (!selectedFiles.length) return;

            document.body.style.cursor = "progress";
            uploadLabel.classList.add("disabled");
            uploadLabel.textContent = "Checking...";

            let uploaded = 0;
            let duplicates = 0;
            const failed = [];

            for (const file of selectedFiles) {
                try {
                    const result = await uploadFile(file);

                    if (result.duplicate) {
                        duplicates++;
                    } else {
                        galleryItems.unshift(result);
                        uploaded++;
                    }
                } catch (error) {
                    console.error(error);
                    failed.push(error.message);
                }
            }

            sortGallery(sortSelect.value);

            const parts = [];
            if (uploaded) parts.push(`${uploaded} uploaded`);
            if (duplicates) parts.push(`${duplicates} duplicate${duplicates === 1 ? "" : "s"} skipped`);

            if (failed.length) {
                parts.push(`${failed.length} failed`);
                showMessage(`${parts.join(" • ")}: ${failed.join(" | ")}`, "error");
            } else {
                showMessage(
                    parts.length ? parts.join(" • ") : "Nothing uploaded.",
                    duplicates && !uploaded ? "success" : "success"
                );
            }

            document.body.style.cursor = "";
            uploadLabel.classList.remove("disabled");
            uploadLabel.textContent = "Upload";
            input.value = "";
        });

        function openImage(url, fileName) {
            zoomedImage.src = url;
            zoomedImage.alt = fileName || "Selected image";
            imageModal.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function closeImage() {
            imageModal.classList.add("hidden");
            zoomedImage.removeAttribute("src");
            document.body.style.overflow = "";
        }

        closeButton.addEventListener("click", closeImage);

        imageModal.addEventListener("click", event => {
            if (event.target === imageModal) closeImage();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !imageModal.classList.contains("hidden")) {
                closeImage();
            }
        });

        logoutButton.addEventListener("click", () => localStorage.clear());

        loadUserStatus();
        loadPhotos();
    </script>
</body>
</html>
