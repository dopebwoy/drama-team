<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drama Team">
  <link rel="apple-touch-icon" href="/photos/apple-touch-icon.png">
  <script src="/pwa.js" defer></script>
  <meta name="description" content="Join the Drama Team Family LiveKit video room.">
  <title>Live Meeting | Drama Team Family</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#303943; --text:#f3efe7; --muted:#b9c2ca; --accent:#6ee7d8; --gold:#e6c989; }
    * { box-sizing:border-box }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
    body { margin:0; min-height:100vh; background:linear-gradient(145deg,#0b1716,#111827 65%,#1a1c20); color:var(--text); font:16px system-ui,sans-serif }
    .shell { width:min(1100px,94vw); margin:0 auto; padding:24px 0 40px }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:12px 4px 22px }
    header strong { color:var(--gold); letter-spacing:.08em; text-transform:uppercase }
    a { color:var(--text) }
    .panel { background:rgba(22,27,34,.94); border:1px solid var(--line); border-radius:18px; padding:clamp(20px,4vw,36px); box-shadow:0 24px 60px #0005 }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:.76rem }
    h1 { margin:8px 0; font-size:clamp(2rem,5vw,3rem) }
    .lead { color:var(--muted); line-height:1.6; margin:0 0 22px }
    .join-form,.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
    input,button { font:inherit; border-radius:10px; padding:11px 14px }
    input { color:var(--text); background:#0d1117; border:1px solid #46515d; min-width:min(250px,100%) }
    button { color:#111; background:var(--gold); border:0; font-weight:700; cursor:pointer }
    button.secondary { color:var(--text); background:#27313b; border:1px solid #46515d }
    button:disabled { opacity:.55; cursor:wait }
    #status { min-height:1.5em; color:var(--muted); margin:14px 0 }
    #status[data-kind="error"] { color:#ff9e9e }
    #status[data-kind="success"] { color:var(--accent) }
    .room { border:1px solid var(--line); border-radius:14px; min-height:0; background:#080b0e; overflow:hidden }
    .participants { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-rows:clamp(50px,10vw,135px); align-content:start; gap:8px; max-height:55vh; overflow-y:auto; padding:8px }
    .participant { position:relative; min-width:0; min-height:0; display:grid; place-items:center; overflow:hidden; border:1px solid #303943; border-radius:10px; background:#1b232b; color:var(--muted); cursor:pointer }
    .participant.is-featured { grid-column:span 2; grid-row:span 2; border-color:#6ee7d8; box-shadow:0 0 0 1px #6ee7d866 }
    .participant:focus-visible { outline:2px solid var(--gold); outline-offset:2px }
    .participant video { display:block; width:100%; height:100%; min-height:0; object-fit:cover }
    .participant audio { display:none }
    .participant-name { position:absolute; left:10px; bottom:10px; z-index:1; color:white; background:#0009; padding:4px 8px; border-radius:6px; font-size:.84rem }
    .empty { grid-column:1/-1; padding:28px 15px; text-align:center; color:var(--muted) }
    .controls { margin:12px 0 }
    #roomControls[hidden] { display:none }
    .meeting-messages { display:grid; gap:5px; max-height:130px; overflow-y:auto; margin:8px 0; }
    .meeting-messages:empty { display:none }
    .meeting-message { margin:0; padding:7px 10px; border:1px solid #303943; border-radius:8px; background:#111820; color:var(--muted); font-size:.88rem }
    @media(max-width:600px) { .shell { width:100%; padding:10px 0 } .panel { padding:16px 12px; border-radius:0; border-left:0; border-right:0 } .join-form>* { width:100% } .participants { grid-auto-rows:clamp(48px,14vw,80px); gap:6px; padding:6px; max-height:55vh } .participant { border-radius:7px } .participant-name { left:4px; bottom:4px; max-width:calc(100% - 8px); padding:3px 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.68rem } }
  </style>
</head>
<body>
  <main class="shell">
    <header><strong>Drama Team Family</strong><a href="index.html">🏠Back home</a></header>
    <section class="panel" aria-labelledby="title">
      <div class="eyebrow">drama team family meet</div>
      <h1 id="title">Join the live meeting</h1>
      <p class="lead">Enter your name to join. Your microphone and camera start off; turn either one on when you are ready.</p>
      <form id="joinForm" class="join-form">
        <label class="sr-only" for="participantName">Your name</label>
        <input id="participantName" name="name" maxlength="80" autocomplete="name" placeholder="Your name" required>
        <button id="joinButton" type="submit">Join room</button>
      </form>
      <p id="status" role="status" aria-live="polite">Checking LiveKit settings</p>
      <div id="roomControls" class="controls" hidden>
        <button id="micButton" type="button" class="secondary">Unmute microphone</button>
        <button id="cameraButton" type="button" class="secondary">Turn camera on</button>
        <button id="screenButton" type="button" class="secondary">Share screen</button>
        <button id="leaveButton" type="button">Leave room</button>
      </div>
      <div id="meetingMessages" class="meeting-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="room"><div id="participants" class="participants"><div class="empty">No one is live. Join to start.</div></div></div>
    </section>
  </main>
  <script type="module">
    import { Room, RoomEvent, Track, VideoPresets } from 'https://esm.sh/livekit-client@2.23.0';

    const form = document.getElementById('joinForm');
    const nameInput = document.getElementById('participantName');
    const joinButton = document.getElementById('joinButton');
    const statusEl = document.getElementById('status');
    const participantsEl = document.getElementById('participants');
    const controls = document.getElementById('roomControls');
    const micButton = document.getElementById('micButton');
    const cameraButton = document.getElementById('cameraButton');
    const screenButton = document.getElementById('screenButton');
    const messagesEl = document.getElementById('meetingMessages');
    let room;
    let isInRoom = false;
    let featuredIdentity = null;
    const tiles = new Map();
    const attachedTracks = new WeakMap();

    try {
      const saved = JSON.parse(localStorage.getItem('status') || '[]');
      if (Array.isArray(saved) && typeof saved[2] === 'string') nameInput.value = saved[2];
    } catch { /* The name is optional; malformed saved browser data is ignored. */ }

    function setStatus(message, kind = '') {
      statusEl.textContent = message;
      statusEl.dataset.kind = kind;
    }

    function addMeetingMessage(message) {
      const entry = document.createElement('p');
      entry.className = 'meeting-message';
      entry.textContent = message;
      messagesEl.append(entry);
      while (messagesEl.childElementCount > 6) messagesEl.firstElementChild.remove();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setFeaturedParticipant(identity) {
      const tile = tiles.get(identity);
      if (!tile) return;
      featuredIdentity = identity;
      for (const [participantIdentity, participantTileEl] of tiles) {
        const isFeatured = participantIdentity === identity;
        participantTileEl.classList.toggle('is-featured', isFeatured);
        participantTileEl.setAttribute('aria-pressed', String(isFeatured));
      }
      participantsEl.prepend(tile);
    }

    function removeMediaElement(element) {
      element.pause?.();
      if (element instanceof HTMLMediaElement) element.srcObject = null;
      element.remove();
    }

    function detachTrack(track) {
      try {
        track.detach().forEach(removeMediaElement);
      } catch (error) {
        console.warn('Could not detach a meeting track:', error);
      }
      attachedTracks.delete(track);
    }

    function detachParticipantTracks(participant) {
      for (const publication of participant.trackPublications.values()) {
        if (publication.track) detachTrack(publication.track);
      }
    }

    function clearRoomTiles(activeRoom) {
      if (activeRoom) {
        detachParticipantTracks(activeRoom.localParticipant);
        for (const participant of activeRoom.remoteParticipants.values()) detachParticipantTracks(participant);
      }
      for (const tile of tiles.values()) {
        tile.querySelectorAll('video,audio').forEach(removeMediaElement);
      }
      tiles.clear();
      featuredIdentity = null;
      participantsEl.replaceChildren();
    }

    function showEmptyRoom(message) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      participantsEl.replaceChildren(empty);
    }

    async function checkConfiguration() {
      try {
        const response = await fetch('/.netlify/functions/livekit-token');
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'LiveKit environment variables are missing.');
        setStatus(`Ready to connect to room ☺️${result.roomName}🔛.`, 'success');
      } catch (error) {
        setStatus(`${error.message} Start the local site with â€œnpm run devâ€ and set the server environment first.`, 'error');
      }
    }

    function participantTile(participant) {
      let tile = tiles.get(participant.identity);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'participant';
        tile.dataset.identity = participant.identity;
        const label = document.createElement('span');
        label.className = 'participant-name';
        label.textContent = participant.name || participant.identity;
        tile.append(label);
        tile.tabIndex = 0;
        tile.setAttribute('role', 'button');
        tile.setAttribute('aria-label', `${label.textContent}, make main video`);
        tile.setAttribute('aria-pressed', 'false');
        tile.addEventListener('click', () => setFeaturedParticipant(participant.identity));
        tile.addEventListener('keydown', event => {
          if (event.target === tile && (event.key === 'Enter' || event.key === ' ')) {
            event.preventDefault();
            setFeaturedParticipant(participant.identity);
          }
        });
        tiles.set(participant.identity, tile);
        participantsEl.querySelector('.empty')?.remove();
        participantsEl.append(tile);
      }
      return tile;
    }

    function attachTrack(track, participant) {
      if (attachedTracks.has(track)) return;
      if (track.kind === Track.Kind.Audio && participant.isLocal) return;
      const tile = participantTile(participant);
      const element = track.attach();
      attachedTracks.set(track, element);
      element.autoplay = true;
      if (participant.isLocal) element.muted = true;
      if (track.kind === Track.Kind.Video) {
        element.playsInline = true;
        tile.querySelectorAll('video').forEach(removeMediaElement);
        tile.prepend(element);
      } else {
        tile.append(element);
      }
      element.play?.().catch(() => setStatus('Room connected. Tap the video or audio control if playback is blocked.', ''));
    }

    function removeParticipant(participant) {
      detachParticipantTracks(participant);
      const tile = tiles.get(participant.identity);
      if (tile) tile.remove();
      tiles.delete(participant.identity);
      if (isInRoom) addMeetingMessage(`${participant.name || participant.identity} left the meeting.`);
      if (!tiles.size) {
        featuredIdentity = null;
        showEmptyRoom('Waiting for participants.');
      } else if (featuredIdentity === participant.identity) {
        const localIdentity = room?.localParticipant.identity;
        setFeaturedParticipant(tiles.has(localIdentity) ? localIdentity : tiles.keys().next().value);
      }
    }

    function handleRoomDisconnected(activeRoom) {
      isInRoom = false;
      clearRoomTiles(activeRoom);
      showEmptyRoom('You are not connected to the meeting.');
      if (room === activeRoom) room = undefined;
      controls.hidden = true;
      form.hidden = false;
      joinButton.disabled = false;
      micButton.textContent = 'Unmute microphone';
      cameraButton.textContent = 'Turn camera on';
      screenButton.textContent = 'Share screen';
      setStatus('Meeting connection ended. You can rejoin the room.', 'error');
    }

    async function leaveRoom() {
      const leavingRoom = room;
      isInRoom = false;
      room = undefined;
      if (leavingRoom) await leavingRoom.disconnect().catch(() => {});
      clearRoomTiles(leavingRoom);
      showEmptyRoom('You left the meeting.');
      controls.hidden = true;
      form.hidden = false;
      joinButton.disabled = false;
      micButton.textContent = 'Unmute microphone';
      cameraButton.textContent = 'Turn camera on';
      screenButton.textContent = 'Share screen';
      setStatus('You left the meeting.', '');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (room) return;
      joinButton.disabled = true;
      setStatus('Getting a secure room tokenâ€¦');
      try {
        const response = await fetch('/.netlify/functions/livekit-token', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: nameInput.value.trim(),
            role: sessionStorage.getItem('dtm_manager_session') ? 'umukomite' : 'umufamiliye',
            managerSessionToken: sessionStorage.getItem('dtm_manager_session')
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not create a room token.');

        room = new Room({
          adaptiveStream: true,
          dynacast: true,
          disconnectOnPageLeave: true,
          videoCaptureDefaults: {
            resolution: VideoPresets.h720.resolution,
            frameRate: 30,
          },
          publishDefaults: {
            videoEncoding: VideoPresets.h720.encoding,
          },
        });
        const activeRoom = room;
        room.on(RoomEvent.TrackSubscribed, (track, _publication, participant) => attachTrack(track, participant));
        room.on(RoomEvent.TrackUnsubscribed, track => detachTrack(track));
        room.on(RoomEvent.LocalTrackPublished, (publication, participant) => {
          if (publication.track) attachTrack(publication.track, participant);
        });
        room.on(RoomEvent.LocalTrackUnpublished, publication => {
          if (publication.track) detachTrack(publication.track);
        });
        room.on(RoomEvent.ParticipantConnected, participant => {
          participantTile(participant);
          if (isInRoom) addMeetingMessage(`${participant.name || participant.identity} joined the meeting.`);
        });
        room.on(RoomEvent.ParticipantDisconnected, participant => removeParticipant(participant));
        room.on(RoomEvent.Disconnected, () => {
          handleRoomDisconnected(activeRoom);
        });
        room.on(RoomEvent.Reconnecting, () => setStatus('Connection interrupted. Reconnecting…', ''));
        room.on(RoomEvent.Reconnected, () => setStatus('Reconnected to the meeting.', 'success'));
        setStatus('Connecting to LiveKitâ€¦');
        await room.connect(data.serverUrl, data.token);
        isInRoom = true;
        participantTile(room.localParticipant);
        setFeaturedParticipant(room.localParticipant.identity);
        for (const participant of room.remoteParticipants.values()) {
          participantTile(participant);
          for (const publication of participant.trackPublications.values()) {
            if (publication.track) attachTrack(publication.track, participant);
          }
        }
        screenButton.textContent = 'Share screen';
        micButton.textContent = 'Unmute microphone';
        cameraButton.textContent = 'Turn camera on';
        form.hidden = true;
        controls.hidden = false;
        addMeetingMessage('You joined the meeting.');
        setStatus(`Connected to ${data.roomName}.`, 'success');
      } catch (error) {
        console.error('LiveKit join failed:', error);
        const failedRoom = room;
        room = undefined;
        isInRoom = false;
        if (failedRoom) {
          await failedRoom.disconnect().catch(() => {});
          clearRoomTiles(failedRoom);
        }
        showEmptyRoom('No one is live. Join to start.');
        controls.hidden = true;
        form.hidden = false;
        setStatus(error.message || 'Could not join the room.', 'error');
        joinButton.disabled = false;
      }
    });

    micButton.addEventListener('click', async () => {
      if (!room) return;
      const enabled = !room.localParticipant.isMicrophoneEnabled;
      try {
        await room.localParticipant.setMicrophoneEnabled(enabled);
        micButton.textContent = enabled ? 'Mute microphone' : 'Unmute microphone';
      } catch (error) {
        setStatus(error.message || 'Could not change the microphone setting.', 'error');
      }
    });
    cameraButton.addEventListener('click', async () => {
      if (!room) return;
      const enabled = !room.localParticipant.isCameraEnabled;
      try {
        await room.localParticipant.setCameraEnabled(enabled);
        cameraButton.textContent = enabled ? 'Turn camera off' : 'Turn camera on';
      } catch (error) {
        setStatus(error.message || 'Could not change the camera setting.', 'error');
      }
    });
    screenButton.addEventListener('click', async () => {
      if (!room) return;
      const enabled = !room.localParticipant.isScreenShareEnabled;
      try {
        await room.localParticipant.setScreenShareEnabled(enabled);
        screenButton.textContent = enabled ? 'Stop screen share' : 'Share screen';
      } catch (error) {
        setStatus(error.message || 'Could not change screen sharing.', 'error');
      }
    });
    document.getElementById('leaveButton').addEventListener('click', leaveRoom);
    checkConfiguration();
  </script>
</body>
</html>
