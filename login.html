<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DTm</title>
    <link rel="icon" type="image/icon" href="./photos/logo.png">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-soft: #1e293b;
            --card-bg: rgba(15, 23, 42, 0.8);
            --gold: #f7dfb6;
            --gold-strong: #ecd9b1;
            --white: #f8fafc;
            --muted: #cbd5e1;
            --border: rgba(255, 255, 255, 0.12);
            --shadow: rgba(15, 23, 42, 0.35);
            --success: #34d399;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.85)),
                url('./photos/backonlogin.jpg') center/cover no-repeat fixed;
            color: var(--white);
        }

        .page-shell {
            width: min(92vw, 460px);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 28px 24px;
            box-shadow: 0 20px 45px var(--shadow);
            backdrop-filter: blur(8px);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .home-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: none;
        }

        .home-link:hover {
            color: var(--muted);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 2.5rem);
            text-align: center;
        }

        .subtitle {
            margin: 0 0 22px;
            text-align: center;
            color: var(--muted);
            font-size: 0.97rem;
        }

        .role-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-btn {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.08);
            color: var(--white);
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: none;
        }

        .role-btn:hover {
            background: rgba(148, 163, 184, 0.08);
            box-shadow: none;
            transform: none;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-strong));
            color: #111827;
            border-color: transparent;
            box-shadow: none;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--white);
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: none;
        }

        input:focus {
            border-color: var(--border);
            box-shadow: none;
        }

        .submit-btn {
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f3bf65, #eea672);
            color: #fff;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: none;
        }

        .submit-btn:hover {
            transform: none;
            box-shadow: none;
        }

        .status-text {
            margin-top: 16px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <div class="login-card">
            <div class="top-bar">
                <div class="brand">DTm</div>
                <a href="index.html" class="home-link">← Home</a>
            </div>

            <h1>Welcome back</h1>
            <p class="subtitle">Choose </p>

            <div class="role-switch" aria-label="Choose role">
                <button type="button" class="role-btn active" data-role="member">Member</button>
                <button type="button" class="role-btn" data-role="umukomite">Umukomite</button>
            </div>

            <form id="loginForm">
                <div>
                    <label for="name">Your name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div>
                    <label for="pass">Password</label>
                    <input type="password" id="pass" placeholder="Enter password" required>
                </div>

                <button type="submit" class="submit-btn">Continue</button>
            </form>

            <p class="status-text"> hitamo aho kwinjira neza</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://fedwjrefdabcbbklaafz.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wL7XncIhcH0fqjL_Mxo4Lg_U5z_2edi";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const roleButtons = document.querySelectorAll('.role-btn');
        const loginForm = document.getElementById('loginForm');
        const nameInput = document.getElementById('name');
        const passInput = document.getElementById('pass');
        const public_passkey = localStorage.getItem('password');
        const manager_password = 'umu7.2026';

        let selectedRole = 'member';

        function getStoredName() {
            try {
                const savedStatus = JSON.parse(localStorage.getItem('status') || '[]');
                if (Array.isArray(savedStatus)) {
                    return String(savedStatus[2] || savedStatus[1] || '').trim();
                }
            } catch (error) {
                console.warn('Could not read saved name:', error);
            }
            return '';
        }

        async function recordLogin(name, role) {
            const record = {
                name: String(name || 'Unknown').trim() || 'Unknown',
                role,
                logged_in_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient
                    .from('login_activity')
                    .insert(record);

                if (!error) {
                    console.log('Saved login to Supabase');
                }
            } catch (error) {
                console.warn('Supabase login save failed, using browser fallback:', error);
            }

            try {
                const logs = JSON.parse(localStorage.getItem('dtm_login_log') || '[]');
                const validLogs = Array.isArray(logs) ? logs : [];
                validLogs.push(record);
                localStorage.setItem('dtm_login_log', JSON.stringify(validLogs.slice(-500)));
            } catch (error) {
                console.warn('Could not save login log locally:', error);
            }
        }

        roleButtons.forEach((button) => {
            button.addEventListener('click', () => {
                selectedRole = button.dataset.role;
                roleButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
            });
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const password = passInput.value.trim();

            if (!name || !password) {
                alert('Please enter your name and password.');
                return;
            }

            if (selectedRole === 'member') {
                if (public_passkey && public_passkey === password) {
                    const savedStatus = JSON.parse(localStorage.getItem('status') || '[]');
                    const status = Array.isArray(savedStatus) ? savedStatus : [];
                    status[0] = 'old';
                    status[1] = 'active';
                    status[2] = name;
                    localStorage.setItem('status', JSON.stringify(status));
                    recordLogin(name, 'member');
                    passInput.value = '';
                    window.location.href = 'store.html';
                    return;
                }

                alert('Incorrect member password.');
                return;
            }

            if (password === manager_password) {
                alert('Welcome, Umukomite dashboard is loading...');
                const savedStatus = JSON.parse(localStorage.getItem('status') || '[]');
                const status = Array.isArray(savedStatus) ? savedStatus : [];
                status[0] = 'old';
                status[1] = 'active';
                status[2] = name;
                localStorage.setItem('status', JSON.stringify(status));
                recordLogin(name, 'umukomite');
                passInput.value = '';
                window.location.href = 'umukomite.html';
                return;
            }

            alert('Incorrect Umukomite password.');
        });
    </script>
</body>

</html>
