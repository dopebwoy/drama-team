<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meeting | Drama Team Family</title>
    <meta name="description" content="Join the live Drama Team Family meeting room.">
    <style>
        :root {
            --bg: #0d1117;
            --bg-soft: #161b22;
            --panel: rgba(22, 27, 34, 0.9);
            --panel-soft: rgba(30, 39, 48, 0.8);
            --text: #f3efe7;
            --muted: #dfe6e1;
            --line: rgba(255, 255, 255, 0.12);
            --accent: #6ee7d8;
            --gold: #e6c989;
            --shadow: rgba(0, 0, 0, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: var(--text);
            background: linear-gradient(rgba(8, 18, 16, 0.78), rgba(8, 18, 16, 0.82)),
                url('./photos/imageonindex.png') center/cover no-repeat fixed;
        }

        .page-shell {
            width: min(980px, 92vw);
        }

        .meeting-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 30px 60px var(--shadow);
            overflow: hidden;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: rgba(10, 16, 20, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .home-link {
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .content {
            padding: 26px 22px 18px;
        }

        .eyebrow {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(110, 231, 216, 0.08);
            border: 1px solid rgba(110, 231, 216, 0.25);
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.7rem;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.9rem);
        }

        .lead {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1.04rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            font-family: Georgia, 'Times New Roman', Times, serif;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .primary {
            background: linear-gradient(135deg, var(--gold), #f5e4b6);
            color: #17130d;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .status {
            color: var(--muted);
            font-size: 0.94rem;
            min-height: 1.5em;
        }

        .room-info {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.95rem;
        }

        .video-shell {
            margin-top: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0,0,0,0.25);
        }

        iframe {
            display: block;
            width: 100%;
            min-height: 520px;
            border: 0;
            background: #000;
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 14px 16px;
            }

            .content {
                padding: 20px 16px 14px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            iframe {
                min-height: 360px;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <div class="meeting-card">
            <div class="topbar">
                <div class="brand">Drama Team</div>
                <a class="home-link" href="index.html">← Back home</a>
            </div>

            <div class="content">
                <div class="eyebrow">Live room</div>
                <h1>Join the live meeting</h1>
                <p class="lead">This page opens the room for live members. Update the subdomain below once with your Daily domain, then click the button to join.</p>

                <div class="controls">
                    <button id="joinMeetingBtn" class="btn primary" type="button">Join Meeting Now</button>
                    <button id="openInNewTabBtn" class="btn secondary" type="button">Open in new tab</button>
                </div>

                <div id="status" class="status">Preparing live room...</div>

                <div class="room-info">
                    Room name: <strong>drama-team-family</strong>
                </div>

                <div id="videoShell" class="video-shell" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script>
        const DAILY_SUBDOMAIN = "drama-team-family";
        const ROOM_NAME = "drama-team-family";
        const roomUrl = `https://${DAILY_SUBDOMAIN}.daily.co/${ROOM_NAME}`;

        const statusEl = document.getElementById('status');
        const videoShell = document.getElementById('videoShell');
        const joinBtn = document.getElementById('joinMeetingBtn');
        const openInNewTabBtn = document.getElementById('openInNewTabBtn');

        function embedRoom() {
            const iframe = document.createElement('iframe');
            iframe.src = roomUrl;
            iframe.title = 'Drama Team Family live meeting';
            iframe.allow = 'camera; microphone; fullscreen; display-capture; clipboard-write';
            iframe.allowFullscreen = true;
            iframe.referrerPolicy = 'strict-origin-when-cross-origin';
            videoShell.innerHTML = '';
            videoShell.appendChild(iframe);
        }

        function openRoom() {
            statusEl.textContent = 'Opening the live meeting room...';
            window.open(roomUrl, '_blank', 'noopener,noreferrer');
        }

        joinBtn.addEventListener('click', () => {
            statusEl.textContent = 'Connecting to the meeting room...';
            embedRoom();
        });

        openInNewTabBtn.addEventListener('click', openRoom);

        statusEl.textContent = 'Ready. Click the button to join.';
    </script>
</body>

</html>
